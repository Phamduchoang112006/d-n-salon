<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Trị & Vận Hành Cho Thuê Sách Enterprise</title>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React 18 & Babel Local Assets -->
    <script src="assets/react.development.js"></script>
    <script src="assets/react-dom.development.js"></script>
    <script src="assets/babel.min.js"></script>
    <script>
        window.addEventListener('error', function(e) {
            console.error('Global Error caught:', e);
            var root = document.getElementById('root');
            if (root && root.innerHTML.includes('Đang Khởi Chạy')) {
                root.innerHTML = '<div style="padding: 40px; text-align: center; font-family: system-ui, sans-serif;"><div style="background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; padding: 20px; border-radius: 12px; max-width: 600px; margin: 0 auto; text-align: left;"><h3 style="margin-top:0;">⚠️ Lỗi Khởi Chạy Trình Duyệt:</h3><p><b>' + (e.message || 'Lỗi tải Script') + '</b></p><p style="font-size:0.85rem; color:#b91c1c;">Vui lòng nhấn tổ hợp phím <b>Ctrl + F5</b> hoặc thử mở trên cửa sổ Ẩn danh (Incognito Window) để tải lại bản mới nhất.</p></div></div>';
            }
        });
    </script>

    <!-- Custom Modern UI CSS -->
    <link rel="stylesheet" href="library_style.css">

    <style>
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15,23,42,0.65);
            backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; padding: 20px;
        }
        .modal-card {
            background: #ffffff;
            border-radius: 16px;
            width: 100%; max-width: 680px;
            max-height: 90vh; overflow-y: auto;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding-bottom: 16px; border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .modal-header h3 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
        .close-btn { background: none; border: none; font-size: 1.4rem; color: var(--text-muted); cursor: pointer; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.9rem; transition: border-color 0.2s; }
        .form-control:focus { outline: none; border-color: var(--primary); }
        .table-responsive { width: 100%; overflow-x: auto; background: #fff; border-radius: 16px; border: 1px solid var(--border-color); }
        .custom-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        .custom-table th { background: #f8fafc; padding: 14px 18px; font-weight: 700; color: var(--text-muted); border-bottom: 1px solid var(--border-color); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
        .custom-table td { padding: 14px 18px; border-bottom: 1px solid #f1f5f9; color: var(--text-primary); vertical-align: middle; }
        .custom-table tr:hover { background-color: #f8fafc; }
        .book-thumb { width: 44px; height: 56px; object-fit: cover; border-radius: 6px; }
        .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #e0f2fe; color: #075985; }
        .btn-group { display: flex; gap: 8px; }

        /* ANALYTICS CHARTS CSS */
        .chart-bar-container { display: flex; align-items: flex-end; gap: 16px; height: 160px; padding: 20px 0; border-bottom: 2px solid #e2e8f0; margin-bottom: 16px; }
        .chart-bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .chart-bar-wrapper { display: flex; gap: 6px; align-items: flex-end; height: 120px; width: 100%; justify-content: center; }
        .chart-bar { width: 18px; border-radius: 6px 6px 0 0; transition: height 0.5s ease; }
        .chart-bar.borrow { background: #3b82f6; }
        .chart-bar.return { background: #10b981; }

        .rbac-badge-pill {
            padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; font-family: 'Inter', system-ui, sans-serif; color: #3b82f6;">
            <div style="width: 52px; height: 52px; border: 4px solid #e0f2fe; border-top: 4px solid #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;"></div>
            <h3 style="font-weight: 800; font-size: 1.2rem; color: #1e293b;">Đang Khởi Chạy Cổng Quản Trị Enterprise...</h3>
            <p style="color: #64748b; font-size: 0.9rem; margin-top: 6px;">Vui lòng chờ trong giây lát</p>
        </div>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_BASE = 'library_api.php';

        function BookCover({ src, title, author, category, style, className }) {
            const [imgError, setImgError] = useState(false);

            useEffect(() => {
                setImgError(false);
            }, [src]);

            const isDataUri = src && src.startsWith('data:image');
            
            if (src && !imgError && !isDataUri) {
                return (
                    <img 
                        src={src} 
                        className={className} 
                        style={{
                            width: '44px',
                            height: '56px',
                            objectFit: 'contain',
                            background: '#ffffff',
                            borderRadius: '6px',
                            boxShadow: '0 2px 6px rgba(0,0,0,0.1)',
                            ...style
                        }} 
                        alt={title} 
                        onError={() => setImgError(true)} 
                    />
                );
            }

            let bgGrad = 'linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%)';
            let iconClass = 'fas fa-book-open';
            let catBadge = 'THƯ VIỆN SỐ';

            const cleanCat = String(category || '');
            if (cleanCat.includes('Truyện') || cleanCat.includes('Manga') || cleanCat.includes('Comic')) {
                bgGrad = 'linear-gradient(135deg, #db2777 0%, #831843 100%)';
                iconClass = 'fas fa-paint-brush';
                catBadge = 'MANGA & COMIC';
            } else if (cleanCat.includes('Công Nghệ') || cleanCat.includes('Lập Trình') || cleanCat.includes('IT')) {
                bgGrad = 'linear-gradient(135deg, #0f172a 0%, #0284c7 100%)';
                iconClass = 'fas fa-laptop-code';
                catBadge = 'CÔNG NGHỆ IT';
            } else if (cleanCat.includes('Kỹ Năng') || cleanCat.includes('Kinh Tế')) {
                bgGrad = 'linear-gradient(135deg, #059669 0%, #047857 100%)';
                iconClass = 'fas fa-bolt';
                catBadge = 'KỸ NĂNG & KINH TẾ';
            } else if (cleanCat.includes('Tiểu Thuyết') || cleanCat.includes('Trinh Thám')) {
                bgGrad = 'linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%)';
                iconClass = 'fas fa-search-location';
                catBadge = 'TIỂU THUYẾT';
            }

            return (
                <div 
                    className={className} 
                    style={{
                        background: bgGrad,
                        borderRadius: '8px',
                        position: 'relative',
                        display: 'flex',
                        flexDirection: 'column',
                        alignItems: 'center',
                        justify: 'center',
                        padding: '4px',
                        color: '#ffffff',
                        boxShadow: '0 4px 10px rgba(0,0,0,0.15)',
                        boxSizing: 'border-box',
                        overflow: 'hidden',
                        userSelect: 'none',
                        textAlign: 'center',
                        ...style
                    }}
                >
                    <div style={{fontSize: '1rem', marginBottom: '2px'}}><i className={iconClass}></i></div>
                    <div style={{fontSize: '0.55rem', fontWeight: 800, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', width: '100%'}}>{title}</div>
                </div>
            );
        }

        function getSVGBookCover(title, author, category) {
            const cleanTitle = String(title || 'Sách Thư Viện').replace(/[<>&"]/g, '');
            const cleanAuthor = String(author || 'Tác giả').replace(/[<>&"]/g, '');
            const cleanCategory = String(category || 'Sách').replace(/[<>&"]/g, '');

            let bgGrad = ['#3b82f6', '#1d4ed8'];
            let icon = '📖';
            let catBadge = 'THƯ VIỆN SỐ';

            if (cleanCategory.includes('Truyện') || cleanCategory.includes('Manga') || cleanCategory.includes('Comic')) {
                bgGrad = ['#ec4899', '#831843'];
                icon = '🎨';
                catBadge = 'MANGA & COMIC';
            } else if (cleanCategory.includes('Công Nghệ') || cleanCategory.includes('Lập Trình') || cleanCategory.includes('IT')) {
                bgGrad = ['#0f172a', '#0284c7'];
                icon = '💻';
                catBadge = 'CÔNG NGHỆ IT';
            } else if (cleanCategory.includes('Kỹ Năng') || cleanCategory.includes('Kinh Tế')) {
                bgGrad = ['#10b981', '#047857'];
                icon = '⚡';
                catBadge = 'KỸ NĂNG & KINH TẾ';
            } else if (cleanCategory.includes('Tiểu Thuyết') || cleanCategory.includes('Trinh Thám')) {
                bgGrad = ['#8b5cf6', '#4c1d95'];
                icon = '🔍';
                catBadge = 'TIỂU THUYẾT';
            }

            const words = cleanTitle.split(' ');
            const lines = [];
            let currentLine = '';
            words.forEach(w => {
                if ((currentLine + ' ' + w).length > 16) {
                    if (currentLine) lines.push(currentLine.trim());
                    currentLine = w;
                } else {
                    currentLine += ' ' + w;
                }
            });
            if (currentLine.trim()) lines.push(currentLine.trim());
            const finalLines = lines.slice(0, 4);

            const titleY = 200 - (finalLines.length * 10);
            const titleXml = finalLines.map((l, idx) => `<text x="150" y="${titleY + (idx * 24)}" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">${l}</text>`).join('');

            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
                <defs>
                    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="${bgGrad[0]}"/>
                        <stop offset="100%" stop-color="${bgGrad[1]}"/>
                    </linearGradient>
                    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
                        <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
                    </linearGradient>
                </defs>
                <rect width="300" height="420" rx="12" fill="url(#bg)"/>
                <rect x="0" y="0" width="18" height="420" fill="url(#spine)"/>
                <rect x="30" y="24" width="240" height="372" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
                <rect x="45" y="45" width="140" height="24" rx="12" fill="#ffffff" fill-opacity="0.2"/>
                <text x="115" y="61" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle" letter-spacing="1">${catBadge}</text>
                <text x="150" y="135" font-size="48" text-anchor="middle">${icon}</text>
                ${titleXml}
                <line x1="60" y1="340" x2="240" y2="340" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
                <text x="150" y="365" fill="#f8fafc" font-size="12" font-weight="600" font-family="sans-serif" text-anchor="middle">Tác giả: ${cleanAuthor.slice(0, 24)}</text>
                <text x="150" y="390" fill="#93c5fd" font-size="10" font-family="sans-serif" text-anchor="middle">★ THƯ VIỆN SỐ ENTERPRISE ★</text>
            </svg>`;

            return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        }

        function handleCoverError(e, title, author, category) {
            e.target.onerror = null;
            e.target.src = getSVGBookCover(title, author, category);
        }

        function AdminApp() {
            const [currentAdmin, setCurrentAdmin] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // 3-Tier RBAC Role State ('super_admin', 'librarian', 'cataloger')
            const [adminRole, setAdminRole] = useState('super_admin');

            // Data states
            const [stats, setStats] = useState(null);
            const [books, setBooks] = useState([]);
            const [categories, setCategories] = useState([]);
            const [physicalCopies, setPhysicalCopies] = useState([]);
            const [readers, setReaders] = useState([]);
            const [borrows, setBorrows] = useState([]);
            const [webReservations, setWebReservations] = useState([]);
            const [donations, setDonations] = useState([]);
            const [analytics, setAnalytics] = useState(null);

            // ADMIN LIVE CHAT STATE
            const [conversations, setConversations] = useState([]);
            const [selectedReaderChat, setSelectedReaderChat] = useState(null);
            const [adminChatMessages, setAdminChatMessages] = useState([]);
            const [adminChatInput, setAdminChatInput] = useState('');

            const [searchQuery, setSearchQuery] = useState('');
            const [filterCategory, setFilterCategory] = useState('');

            // Modals State
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminLoginForm, setAdminLoginForm] = useState({ username: 'admin', password: '123' });

            const [showBookModal, setShowBookModal] = useState(false);
            const [editingBook, setEditingBook] = useState(null);
            const [bookForm, setBookForm] = useState({
                ma_sach: '', ten_sach: '', tac_gia: '', category_id: 1,
                nha_xuat_ban: 'NXB Kim Đồng', nam_xuat_ban: 2023, gia_bia: 50000,
                gia_thue_ngay: 3000, so_luong: 5, hinh_anh: '', isbn: '', mo_ta: ''
            });

            const [isbnInput, setIsbnInput] = useState('9780132350884');
            const [isFetchingIsbn, setIsFetchingIsbn] = useState(false);

            // Batch Import & Issue Member Card Modals
            const [showBatchImportModal, setShowBatchImportModal] = useState(false);
            const [batchJsonText, setBatchJsonText] = useState('');

            const [showIssueCardModal, setShowIssueCardModal] = useState(false);
            const [issueCardForm, setIssueCardForm] = useState({ ho_ten: '', email: '', so_dien_thoai: '', loai_doc_gia: 'Thẻ VIP Gold' });

            const [showCategoryModal, setShowCategoryModal] = useState(false);
            const [categoryForm, setCategoryForm] = useState({ ma_danh_muc: '', ten_danh_muc: '', mo_ta: '' });

            const [showBarcodeModal, setShowBarcodeModal] = useState(false);
            const [barcodeForm, setBarcodeForm] = useState({ book_id: 1, barcode: '', tu_ke_kho: 'Kệ A1-Tủ 01', tinh_trang_hao_mon: 'Mới 99%' });

            const [showTopupModal, setShowTopupModal] = useState(null);
            const [topupAmount, setTopupAmount] = useState(100000);

            // Check-in Scanner State
            const [scanBarcode, setScanBarcode] = useState('');
            const [scanDamageLevel, setScanDamageLevel] = useState('Bình thường');
            const [scanFine, setScanFine] = useState(0);

            useEffect(() => {
                const savedAdmin = localStorage.getItem('admin_user');
                if (savedAdmin) {
                    try { setCurrentAdmin(JSON.parse(savedAdmin)); } catch (e) {}
                } else {
                    setShowAdminLogin(true);
                }

                refreshAllData();
            }, []);

            useEffect(() => {
                fetchBooks();
            }, [searchQuery, filterCategory]);

            const refreshAllData = () => {
                fetchStats();
                fetchBooks();
                fetchCategories();
                fetchReaders();
                fetchBorrows();
                fetchWebReservations();
                fetchDonations();
                fetchAnalytics();
            };

            const fetchStats = async () => {
                try {
                    const res = await fetch(`${API_BASE}?action=stats`);
                    const json = await res.json();
                    if (json.status === 'success') {
                        setStats(json.data.stats);
                        setPhysicalCopies(json.data.physical_copies);
                    }
                } catch (e) { console.error(e); }
            };

            const fetchBooks = async () => {
                try {
                    const res = await fetch(`${API_BASE}?action=get_books&search=${encodeURIComponent(searchQuery)}&category_id=${filterCategory}`);
                    const json = await res.json();
                    if (json.status === 'success') setBooks(json.data.books);
                } catch (e) { console.error(e); }
            };

            const fetchCategories = async () => {
                try {
                    const res = await fetch(`${API_BASE}?action=get_categories`);
                    const json = await res.json();
                    if (json.status === 'success') setCategories(json.data.categories);
                } catch (e) { console.error(e); }
            };

            const fetchReaders = async () => {
                try {
                    const res = await fetch(`${API_BASE}?action=get_readers`);
                    const json = await res.json();
                    if (json.status === 'success') setReaders(json.data.readers);
                } catch (e) { console.error(e); }
            };

            const fetchBorrows = async () => {
                try {
                    const res = await fetch(`${API_BASE}?action=get_orders`);
                    const json = await res.json();
                    if (json.status === 'success') setBorrows(json.data.borrows);
                } catch (e) { console.error(e); }
            };

            const fetchWebReservations = async () => {
                try {
                    const res = await fetch(`${API_BASE}?action=get_all_reservations`);
                    const json = await res.json();
                    if (json.status === 'success') setWebReservations(json.data.reservations);
                } catch (e) { console.error(e); }
            };

            const fetchDonations = async () => {
                try {
                    const res = await fetch(`${API_BASE}?action=get_all_donations`);
                    const json = await res.json();
                    if (json.status === 'success') setDonations(json.data.donations);
                } catch (e) { console.error(e); }
            };

            const fetchAnalytics = async () => {
                try {
                    const res = await fetch(`${API_BASE}?action=get_admin_analytics`);
                    const json = await res.json();
                    if (json.status === 'success') setAnalytics(json.data);
                } catch (e) { console.error(e); }
            };

            // LIVE CHAT POLLING & API HANDLERS
            useEffect(() => {
                let interval;
                fetchChatConversations();
                if (activeTab === 'chat') {
                    interval = setInterval(() => {
                        fetchChatConversations();
                        if (selectedReaderChat) {
                            fetchAdminChatMessages(selectedReaderChat.reader_id);
                        }
                    }, 3000);
                }
                return () => { if (interval) clearInterval(interval); };
            }, [activeTab, selectedReaderChat]);

            const fetchChatConversations = async () => {
                try {
                    const res = await fetch(`${API_BASE}?action=get_chat_conversations`);
                    const json = await res.json();
                    if (json.status === 'success') {
                        const list = json.data.conversations || [];
                        setConversations(list);
                        if (!selectedReaderChat && list.length > 0) {
                            setSelectedReaderChat(list[0]);
                            fetchAdminChatMessages(list[0].reader_id);
                        }
                    }
                } catch (e) { console.error(e); }
            };

            const fetchAdminChatMessages = async (readerId) => {
                try {
                    const res = await fetch(`${API_BASE}?action=get_chat_messages&reader_id=${readerId}&is_admin=1`);
                    const json = await res.json();
                    if (json.status === 'success') setAdminChatMessages(json.data.messages || []);
                } catch (e) { console.error(e); }
            };

            const handleSendAdminChatMessage = async (e) => {
                e.preventDefault();
                if (!selectedReaderChat) return alert('Vui lòng chọn độc giả để gửi tin nhắn!');
                if (!adminChatInput.trim()) return;

                try {
                    const res = await fetch(`${API_BASE}?action=send_chat_message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            reader_id: selectedReaderChat.reader_id,
                            sender_type: 'admin',
                            message_text: adminChatInput.trim()
                        })
                    });
                    const json = await res.json();
                    if (json.status === 'success') {
                        setAdminChatInput('');
                        setAdminChatMessages(json.data.messages || []);
                        fetchChatConversations();
                    }
                } catch (e) { alert('Lỗi gửi tin nhắn phản hồi'); }
            };

            const totalUnreadChat = conversations.reduce((acc, c) => acc + Number(c.unread_count || 0), 0);

            // GOOGLE BOOKS ISBN AUTO-FETCH API HANDLER
            const handleFetchGoogleBooksIsbn = async () => {
                if (!isbnInput.trim()) return alert('Vui lòng nhập mã ISBN!');
                setIsFetchingIsbn(true);
                try {
                    const res = await fetch(`${API_BASE}?action=fetch_google_books_isbn&isbn=${encodeURIComponent(isbnInput.trim())}`);
                    const json = await res.json();
                    setIsFetchingIsbn(false);
                    if (json.status === 'success' && json.data.book) {
                        const b = json.data.book;
                        setBookForm(prev => ({
                            ...prev,
                            ten_sach: b.ten_sach || prev.ten_sach,
                            tac_gia: b.tac_gia || prev.tac_gia,
                            nha_xuat_ban: b.nha_xuat_ban || prev.nha_xuat_ban,
                            nam_xuat_ban: b.nam_xuat_ban || prev.nam_xuat_ban,
                            gia_bia: b.gia_bia || prev.gia_bia,
                            hinh_anh: b.hinh_anh || prev.hinh_anh,
                            mo_ta: b.mo_ta || prev.mo_ta,
                            isbn: b.isbn || isbnInput
                        }));
                        alert(`✅ Đã kéo dữ liệu Google Books thành công cho cuốn: "${b.ten_sach}"!`);
                    } else {
                        alert(json.message || 'Không tìm thấy thông tin ISBN này.');
                    }
                } catch (e) {
                    setIsFetchingIsbn(false);
                    alert('Lỗi kết nối API Google Books!');
                }
            };

            // APPROVE DONATION HANDLER
            const handleApproveDonation = async (donationId) => {
                if (!confirm('Xác nhận phê duyệt sách quyên góp này và cộng 50.000đ điểm thưởng vào Ví độc giả?')) return;
                try {
                    const res = await fetch(`${API_BASE}?action=approve_donation`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: donationId, bonus_wallet: 50000 })
                    });
                    const json = await res.json();
                    alert(json.message);
                    if (json.status === 'success') fetchDonations();

                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.setAttribute('download', filename);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

                    csv += `"${b.ma_sach}","${b.ten_sach}","${b.tac_gia}","${b.ten_danh_muc}",${b.gia_bia},${b.gia_thue_ngay},${b.so_luong},${b.co_san},"${b.tu_ke_kho}"\n`;
                });
                downloadCSV('Bao_Cao_Kho_Sach.csv', csv);
            };

                    csv += `"${r.ma_doc_gia}","${r.ho_ten}","${r.email}","${r.so_dien_thoai}","${r.loai_doc_gia}",${r.so_du_vi},${r.tien_coc_dong_bang}\n`;

                    const res = await fetch(`${API_BASE}?action=${action}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)

                    const json = await res.json();

                        fetchStats();

                try {
                    const res = await fetch(`${API_BASE}?action=delete_book`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id })

                    const json = await res.json();
                    alert(json.message);

                                        <input type="number" className="form-control" required value={topupAmount} onChange={e => setTopupAmount(e.target.value)} style={{fontSize: '1.1rem', fontWeight: 'bold', color: '#10b981'}} />
                                    </div>
                                    <button type="submit" className="btn-rent" style={{width: '100%', padding: '12px', background: '#10b981'}}>Xác Nhận Cộng Tiền Vào Ví</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL ĐĂNG NHẬP ADMIN */}
                    {showAdminLogin && (
                        <div className="modal-overlay">
                            <div className="modal-card" style={{maxWidth: '400px'}}>
                                <div className="modal-header">
                                    <h3>Đăng Nhập Quản Trị Hệ Thống</h3>
                                </div>
                                <form onSubmit={handleAdminLogin}>
                                    <div className="form-group">
                                        <label>Tên Đăng Nhập (*)</label>
                                        <input type="text" className="form-control" required value={adminLoginForm.username} onChange={e => setAdminLoginForm({...adminLoginForm, username: e.target.value})} />
                                    </div>
                                    <div className="form-group">
                                        <label>Mật Khẩu (*)</label>
                                        <input type="password" className="form-control" required value={adminLoginForm.password} onChange={e => setAdminLoginForm({...adminLoginForm, password: e.target.value})} />
                                    </div>
                                    <button type="submit" className="btn-rent" style={{width: '100%', padding: '12px'}}>Đăng Nhập Admin</button>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        try {
            if (typeof ReactDOM.createRoot === 'function') {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(<AdminApp />);
            } else {
                ReactDOM.render(<AdminApp />, document.getElementById('root'));
            }
        } catch (e) {
            console.error('Mount error:', e);
            document.getElementById('root').innerHTML = '<div style="padding: 30px; text-align: center; color: #ef4444; font-family: sans-serif;"><h3>⚠️ Lỗi Khởi Chạy:</h3><p>' + e.message + '</p></div>';
        }
    </script>
</body>
</html>
