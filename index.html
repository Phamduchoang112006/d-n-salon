      for (let i = 0; i < count; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        days.push({
          dateObj: d,
          dateString: d.toISOString().split('T')[0],
          dayName: i === 0 ? 'Hôm nay' : i === 1 ? 'Ngày mai' : dayNames[d.getDay()],
          formattedDate: `${d.getDate()}/${d.getMonth() + 1}`

      }
      return days;

                    </div>

                    <div className="space-y-1">
                      <label className="font-semibold text-stone-700">Mật Khẩu</label>
                      <input 
                        type="password"
                        required
                        placeholder="Nhập mật khẩu"
                        value={authLoginPassword}
                        onChange={(e) => setAuthLoginPassword(e.target.value)}
                        className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-salon-primary/40 text-sm bg-salon-bg"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-salon-primary hover:bg-salon-primaryHover text-white py-3.5 rounded-2xl font-bold text-sm shadow transition flex items-center justify-center gap-2"
                    >
                      <span>Xác Nhận Đăng Nhập</span>
                    </button>
                  </form>
                ) : (
                  /* REGISTER FORM */
                  <form onSubmit={handleModalRegister} className="space-y-3 text-xs">
                    <div className="space-y-1">
                      <label className="font-semibold text-stone-700">Họ và Tên <span className="text-red-500">*</span></label>
                      <input 
                        type="text"
                        required
                        placeholder="Nhập họ và tên đầy đủ"
                        value={authRegName}
                        onChange={(e) => setAuthRegName(e.target.value)}
                        className="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="font-semibold text-stone-700">Số Điện Thoại <span className="text-red-500">*</span></label>
                      <input 
                        type="tel"
                        required
                        placeholder="Số điện thoại"
                        value={authRegPhone}
                        onChange={(e) => setAuthRegPhone(e.target.value)}
                        className="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="font-semibold text-stone-700">Email (Không bắt buộc)</label>
                      <input 
                        type="email"
                        placeholder="khachhang@gmail.com"
                        value={authRegEmail}
                        onChange={(e) => setAuthRegEmail(e.target.value)}
                        className="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div className="space-y-1">
                        <label className="font-semibold text-stone-700">Mật Khẩu <span className="text-red-500">*</span></label>
                        <input 
                          type="password"
                          required
                          placeholder="Mật khẩu"
                          value={authRegPassword}
                          onChange={(e) => setAuthRegPassword(e.target.value)}
                          className="w-full px-3 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg"
                        />
                      </div>
                      <div className="space-y-1">
                        <label className="font-semibold text-stone-700">Xác Nhận <span className="text-red-500">*</span></label>
                        <input 
                          type="password"
                          required
                          placeholder="Nhập lại mật khẩu"
                          value={authRegConfirm}
                          onChange={(e) => setAuthRegConfirm(e.target.value)}
                          className="w-full px-3 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg"
                        />
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-salon-primary hover:bg-salon-primaryHover text-white py-3.5 rounded-2xl font-bold text-sm shadow transition mt-2 flex items-center justify-center gap-2"
                    >
                      <span>Tạo Tài Khoản Khách Hàng</span>
                    </button>
                  </form>
                )}

                {/* Footer links inside Modal */}
                <div className="pt-3 border-t border-stone-100 text-center flex items-center justify-between text-xs text-stone-500">
                  <a href="login.html" className="hover:text-salon-primary font-semibold underline">
                    Mở trang đăng nhập riêng
                  </a>
                  <a href="admin.html" className="hover:text-stone-900 font-semibold underline flex items-center gap-1">
                    🔐 Trang Admin Quản Trị
                  </a>
                </div>

              </div>
            </div>
          )}

          {/* WRITE REVIEW MODAL */}
          {isReviewModalOpen && (
            <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-lg rounded-3xl shadow-2xl border border-stone-200 p-6 sm:p-8 space-y-5 relative animate-in fade-in zoom-in duration-200">
                
                {/* Close Button */}
                <button 
                  onClick={() => { setIsReviewModalOpen(false); setReviewFormError(''); }}
                  className="absolute right-4 top-4 w-9 h-9 rounded-full bg-stone-100 text-stone-500 hover:text-stone-900 hover:bg-stone-200 flex items-center justify-center transition font-bold"
                >
                  ✕
                </button>

                {/* Header */}
                <div className="text-center space-y-1">
                  <div className="w-12 h-12 rounded-full bg-salon-secondaryLight text-salon-primary flex items-center justify-center text-xl font-bold mx-auto mb-1">
                    ✍️
                  </div>
                  <h3 className="font-serif-accent text-xl font-bold text-stone-900">Viết Đánh Giá Trải Nghiệm</h3>
                  <p className="text-xs text-stone-500">Chia sẻ cảm nhận của quý khách để Lumière ngày càng hoàn thiện hơn</p>
                </div>

                {/* Error alert */}
                {reviewFormError && (
                  <div className="bg-rose-50 text-rose-700 p-3 rounded-xl border border-rose-200 text-xs font-semibold text-center">
                    ⚠️ {reviewFormError}
                  </div>
                )}

                <form onSubmit={handleSubmitReview} className="space-y-4 text-xs">
                  
                  {/* Star Rating Picker */}
                  <div className="space-y-1 text-center bg-salon-bg p-4 rounded-2xl border border-salon-border">
                    <label className="font-semibold text-stone-700 block">Đánh giá chất lượng dịch vụ (*)</label>
                    <div className="flex items-center justify-center gap-2 pt-1">
                      {[1, 2, 3, 4, 5].map((star) => (
                        <button
                          key={star}
                          type="button"
                          onMouseEnter={() => setHoverRating(star)}
                          onMouseLeave={() => setHoverRating(0)}
                          onClick={() => setNewReviewRating(star)}
                          className="text-2xl transition-transform hover:scale-125 focus:outline-none"
                        >
                          <span className={(hoverRating || newReviewRating) >= star ? 'text-amber-400' : 'text-stone-300'}>
                            ★
                          </span>
                        </button>
                      ))}
                    </div>
                    <span className="text-xs font-bold text-stone-600 block pt-1">
                      {newReviewRating === 5 && '🌟 Tuyệt vời (5/5 sao)'}
                      {newReviewRating === 4 && '😊 Rất tốt (4/5 sao)'}
                      {newReviewRating === 3 && '😐 Hài lòng (3/5 sao)'}
                      {newReviewRating === 2 && '🙁 Trung bình (2/5 sao)'}
                      {newReviewRating === 1 && '😞 Cần cải thiện (1/5 sao)'}
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="font-semibold text-stone-700">Họ và Tên (*)</label>
                      <input 
                        type="text"
                        required
                        placeholder="Nhập tên của bạn"
                        value={newReviewName}
                        onChange={(e) => setNewReviewName(e.target.value)}
                        className="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg text-sm"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="font-semibold text-stone-700">Dịch Vụ Đã Làm (*)</label>
                      <select
                        value={newReviewService}
                        onChange={(e) => setNewReviewService(e.target.value)}
                        className="w-full px-4 py-2.5 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg text-sm"
                      >
                        <option value="Cắt & Tạo Kiểu Nữ">✂️ Cắt & Tạo Kiểu Nữ</option>
                        <option value="Cắt & Styling Nam Premium">💈 Cắt & Styling Nam Premium</option>
                        <option value="Nhuộm Màu Thời Trang Premium">🎨 Nhuộm Màu Thời Trang Premium</option>
                        <option value="Uốn Sóng Lơi Hàn Quốc">✨ Uốn Sóng Lơi Hàn Quốc</option>
                        <option value="Ép Tóc Lụa Organic">💫 Ép Tóc Lụa Organic</option>
                        <option value="Phục Hồi Keratin Chuyên Sâu">🌿 Phục Hồi Keratin Chuyên Sâu</option>
                        <option value="Gội Đầu Dưỡng Sinh Thảo Dược">🌸 Gội Đầu Dưỡng Sinh Thảo Dược</option>
                      </select>
                    </div>
                  </div>

                  <div className="space-y-1">
                    <label className="font-semibold text-stone-700">Nội Dung Nhận Xét (*)</label>
                    <textarea
                      rows="3"
                      required
                      placeholder="Chia sẻ về trải nghiệm uốn, nhuộm, cắt tóc hoặc thái độ phục vụ..."
                      value={newReviewContent}
                      onChange={(e) => setNewReviewContent(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg text-sm resize-none"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-salon-primary hover:bg-salon-primaryHover text-white py-3.5 rounded-2xl font-bold text-sm shadow transition flex items-center justify-center gap-2"
                  >
                    <span>Gửi Đánh Giá Ngay</span>
                    <i data-lucide="send" className="w-4 h-4"></i>
                  </button>
                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
