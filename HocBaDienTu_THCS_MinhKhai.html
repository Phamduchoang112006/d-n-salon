      <div class="flex items-center gap-3">

        <div>

        </div>
      </div>

      <div id="userHeaderControls" class="flex items-center gap-3">
        <button onclick="openRoleModal()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg border border-sky-400 transition">
          🔁 Đổi vai trò nhanh
        </button>
        <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition">

        </button>
      </div>
    </div>

        <div class="flex items-center gap-2">

        </div>
        <span>Tài khoản: <strong id="bannerUsername">--</strong></span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4" id="mainContainer">
    <!-- Content rendered via JavaScript -->
  </main>

  <!-- ROLE SWITCHER MODAL -->
  <div id="roleModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-center pb-2 border-b">
        <h3 class="font-bold text-slate-800 text-base">⚡ Đổi Vai Trò Nhanh</h3>
        <button onclick="closeRoleModal()" class="text-slate-400 hover:text-slate-600 font-bold">✖</button>
      </div>
      <div id="roleModalUserList" class="space-y-2 max-h-80 overflow-y-auto pr-1">
        <!-- User list rendered via JS -->
      </div>
    </div>
  </div>

      { id: 'tt_6a1_t7_1', classId: 'class_6a1', dayOfWeek: 'Thứ 7', period: 1, session: 'Sáng', subjectId: 'sub_toan', teacherId: 'gv01', room: 'P.101' },
      { id: 'tt_6a1_t7_2', classId: 'class_6a1', dayOfWeek: 'Thứ 7', period: 2, session: 'Sáng', subjectId: 'sub_van', teacherId: 'gv02', room: 'P.101' },
      { id: 'tt_6a1_t7_3', classId: 'class_6a1', dayOfWeek: 'Thứ 7', period: 3, session: 'Sáng', subjectId: 'sub_td', teacherId: 'gv05', room: 'Sân trường' }
    ];

    // --- STATE ENGINE ---
    let state = {
      currentUser: INITIAL_USERS[0],
      users: [...INITIAL_USERS],
      semesters: [...INITIAL_SEMESTERS],
      activeSemesterId: 'sem1',
      classes: [...INITIAL_CLASSES],
      teachers: [...INITIAL_TEACHERS],
      students: [...INITIAL_STUDENTS],
      subjects: [...INITIAL_SUBJECTS],
      assignments: [...INITIAL_ASSIGNMENTS],
      grades: [...INITIAL_GRADES],
      remarks: [...INITIAL_REMARKS],
      timetables: [...INITIAL_TIMETABLE],
      adminTab: 'results',
      adminSelectedClassId: 'class_6a1',
      adminSearchQuery: '',
      teacherTab: 'grades',
      teacherSelectedClassId: 'class_6a1',
      teacherSelectedSubjectId: 'sub_toan',
      studentTab: 'hocba',
      studentSelectedDay: 'Thứ 2'
    };

    function computeDTB(tx1, tx2, tx3, tx4, gk, ck) {
      const txScores = [tx1, tx2, tx3, tx4].filter(s => s !== undefined && s !== null && !isNaN(s) && s !== '');
      if (txScores.length === 0 || gk === undefined || gk === null || isNaN(gk) || gk === '' || ck === undefined || ck === null || isNaN(ck) || ck === '') return undefined;
      const avgTx = txScores.reduce((a, b) => parseFloat(a) + parseFloat(b), 0) / txScores.length;
      const dtb = (avgTx + parseFloat(gk) * 2 + parseFloat(ck) * 3) / 6;
      return Math.round(dtb * 10) / 10;
    }

    function getStudentGrades(studentId, semId = state.activeSemesterId) {
      return state.grades.filter(g => g.studentId === studentId && g.semesterId === semId);
    }

    function getStudentGPA(studentId, semId = state.activeSemesterId) {
      const stGrades = getStudentGrades(studentId, semId);
      const validDtbs = stGrades.map(g => g.dtb).filter(d => d !== undefined && d !== null && !isNaN(d));
      if (validDtbs.length === 0) return undefined;
      const avg = validDtbs.reduce((a, b) => a + b, 0) / validDtbs.length;
      return Math.round(avg * 10) / 10;
    }

    function getAcademicClassification(gpa) {
      if (gpa === undefined || gpa === null) return 'Chưa xếp loại';
      if (gpa >= 8.0) return 'Giỏi';
      if (gpa >= 6.5) return 'Khá';
      if (gpa >= 5.0) return 'Trung bình';
      return 'Yếu';
    }

    function getRoleInfo(role) {
      switch (role) {
        case 'admin': return { label: 'Ban Giám Hiệu', bg: 'bg-blue-100 text-blue-800', emoji: '🛡️' };
        case 'teacher': return { label: 'Giáo Viên', bg: 'bg-emerald-100 text-emerald-800', emoji: '👩‍🏫' };
        default: return { label: 'Phụ Huynh / Học Sinh', bg: 'bg-amber-100 text-amber-800', emoji: '🎓' };
      }
    }

    // --- RENDER MAIN UI ---
    function renderApp() {
      const main = document.getElementById('mainContainer');
      const userBanner = document.getElementById('userBanner');
      const userControls = document.getElementById('userHeaderControls');

      if (!state.currentUser) {

        userControls.classList.add('hidden');
        main.innerHTML = renderLoginView();
        return;

      userBanner.classList.remove('hidden');
      userControls.classList.remove('hidden');

      const roleBadge = getRoleInfo(state.currentUser.role);
      document.getElementById('bannerUserName').innerText = state.currentUser.name;
      document.getElementById('bannerUsername').innerText = state.currentUser.username;

      badgeElem.innerText = roleBadge.label;
      badgeElem.className = `px-2 py-0.5 rounded font-bold text-[10px] ${roleBadge.bg}`;

      if (state.currentUser.role === 'admin') {
        main.innerHTML = renderAdminDashboard();
      } else if (state.currentUser.role === 'teacher') {
        main.innerHTML = renderTeacherDashboard();
      } else {

      }
    }

    // --- LOGIN VIEW ---

                        <div><label class="block text-[10px] text-slate-400">TX2</label><input type="number" step="0.1" id="tx2_${st.id}" ${isLocked?'disabled':''} value="${gr?.tx2??''}" class="w-full text-center border p-1 rounded font-bold bg-white" placeholder="0-10"/></div>
                        <div><label class="block text-[10px] text-amber-700 font-bold">GK</label><input type="number" step="0.1" id="gk_${st.id}" ${isLocked?'disabled':''} value="${gr?.gk??''}" class="w-full text-center border border-amber-300 p-1 rounded font-bold bg-amber-50" placeholder="0-10"/></div>
                        <div><label class="block text-[10px] text-blue-700 font-bold">CK</label><input type="number" step="0.1" id="ck_${st.id}" ${isLocked?'disabled':''} value="${gr?.ck??''}" class="w-full text-center border border-blue-300 p-1 rounded font-bold bg-blue-50" placeholder="0-10"/></div>
                      </div>

                      ${!isLocked ? `<button onclick="saveStudentGrade('${st.id}')" class="w-full bg-emerald-600 text-white font-bold py-1.5 rounded-lg">💾 Lưu Điểm Học Sinh</button>` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : `
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4 text-xs">
              <h3 class="font-bold text-slate-800 text-sm">Ghi Nhận Xét Cho Lớp ${curClass.name}</h3>
              ${classSts.map(st => {
                const rem = state.remarks.find(r => r.studentId === st.id && r.semesterId === activeSem.id);
                return `
                  <div class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-2">
                    <div class="font-bold text-slate-800 text-sm">${st.name} (${st.code})</div>
                    <textarea id="rem_${st.id}" rows="2" class="w-full p-2 border rounded-lg bg-white" placeholder="Nhập nhận xét của GVCN...">${rem?.homeroomRemark || ''}</textarea>
                    <button onclick="saveStudentRemark('${st.id}')" class="w-full bg-emerald-600 text-white font-bold py-1.5 rounded-lg">💾 Lưu Nhận Xét</button>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    // --- STUDENT & PARENT DASHBOARD ---
    function renderStudentDashboard() {
      const activeSem = state.semesters.find(s => s.id === state.activeSemesterId) || state.semesters[0];
      const curSt = state.students.find(s => s.id === state.currentUser?.studentId) || state.students[0];
      const curClass = state.classes.find(c => c.id === curSt.classId) || state.classes[0];
      const gpa = getStudentGPA(curSt.id, activeSem.id);
      const rank = getAcademicClassification(gpa);
      const stGrades = getStudentGrades(curSt.id, activeSem.id);
      const stRemark = state.remarks.find(r => r.studentId === curSt.id && r.semesterId === activeSem.id);

      const curTimetable = state.timetables.filter(t => t.classId === curSt.classId && t.dayOfWeek === state.studentSelectedDay);

      return `
        <div class="space-y-4">
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-800 flex items-center justify-center text-2xl font-bold">🎓</div>
              <div>
                <h2 class="font-black text-slate-800 text-lg">${curSt.name}</h2>
                <p class="text-xs text-slate-500">Mã HS: <strong class="text-sky-700">${curSt.code}</strong> | Lớp: <strong>${curClass.name}</strong></p>
              </div>
            </div>
            <button onclick="window.print()" class="no-print bg-slate-800 text-white text-xs font-bold px-3 py-2 rounded-xl">🖨️ In Học Bạ</button>
          </div>

          <div class="flex bg-white rounded-xl p-1 shadow-sm border border-slate-200 no-print">
            <button onclick="setStudentTab('hocba')" class="flex-1 py-2 rounded-lg text-xs font-bold transition ${state.studentTab==='hocba'?'bg-sky-600 text-white shadow':'text-slate-600'}">📜 Sổ Học Bạ Điện Tử</button>
            <button onclick="setStudentTab('timetable')" class="flex-1 py-2 rounded-lg text-xs font-bold transition ${state.studentTab==='timetable'?'bg-sky-600 text-white shadow':'text-slate-600'}">📅 Thời Khóa Biểu</button>
          </div>

          ${state.studentTab === 'hocba' ? `
            <div class="space-y-4">
              <div class="bg-sky-700 text-white p-5 rounded-2xl shadow-lg space-y-3">
                <div class="flex justify-between items-center border-b border-sky-500 pb-2">
                  <h3 class="font-extrabold text-sm">🏆 TỔNG HỢP HỌC LỰC & HẠNH KIỂM</h3>
                  <span class="text-xs text-sky-200">${activeSem.name} (${activeSem.academicYear})</span>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center">
                  <div>
                    <div class="text-[10px] text-sky-200 uppercase font-bold">ĐTB Tất cả môn</div>
                    <div class="text-2xl font-black">${gpa !== undefined ? gpa.toFixed(1) : 'N/A'}</div>
                  </div>
                  <div>
                    <div class="text-[10px] text-sky-200 uppercase font-bold mb-1">Xếp loại</div>
                    <span class="px-2 py-0.5 rounded text-xs font-extrabold ${rank==='Giỏi'?'bg-emerald-100 text-emerald-800':'bg-blue-100 text-blue-800'}">${rank}</span>
                  </div>
                  <div>
                    <div class="text-[10px] text-sky-200 uppercase font-bold mb-1">Hạnh kiểm</div>
                    <span class="px-2 py-0.5 rounded text-xs font-extrabold bg-indigo-100 text-indigo-800">${stRemark?.conduct || curSt.conduct || 'Tốt'}</span>
                  </div>
                </div>
              </div>

              <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3 text-xs">
                <h3 class="font-extrabold text-slate-800 text-sm">📚 Bảng Điểm Chi Tiết Các Môn Học</h3>
                <div class="space-y-3">
                  ${state.subjects.map(sub => {
                    const gr = stGrades.find(g => g.subjectId === sub.id);
                    return `
                      <div class="border border-slate-200 rounded-xl p-3.5 bg-slate-50 space-y-2">
                        <div class="flex justify-between items-center border-b pb-1">
                          <span class="font-bold text-slate-800">${sub.name} (${sub.code})</span>
                          <span class="font-black text-sky-700 text-sm">ĐTB: ${gr?.dtb !== undefined ? gr.dtb.toFixed(1) : '-'}</span>
                        </div>
                        <div class="grid grid-cols-6 gap-1 text-center font-bold text-[11px]">
                          <div class="bg-white p-1 rounded border">TX1: ${gr?.tx1??'-'}</div>
                          <div class="bg-white p-1 rounded border">TX2: ${gr?.tx2??'-'}</div>
                          <div class="bg-white p-1 rounded border">TX3: ${gr?.tx3??'-'}</div>
                          <div class="bg-white p-1 rounded border">TX4: ${gr?.tx4??'-'}</div>
                          <div class="bg-amber-50 text-amber-800 p-1 rounded border">GK: ${gr?.gk??'-'}</div>
                          <div class="bg-blue-50 text-blue-800 p-1 rounded border">CK: ${gr?.ck??'-'}</div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-2 text-xs">
                <h3 class="font-extrabold text-slate-800 text-sm">💬 Nhận Xét Của Giáo Viên Chủ Nhiệm</h3>
                <p class="italic text-slate-800 bg-slate-50 p-3 rounded-xl border border-slate-200">"${stRemark?.homeroomRemark || 'Chưa có nhận xét.'}"</p>
              </div>
            </div>
          ` : `
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4 text-xs">
              <h3 class="font-extrabold text-slate-800 text-sm">📅 Thời Khóa Biểu - Lớp ${curClass.name}</h3>
              <div class="flex gap-2 overflow-x-auto">
                ${['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'].map(d => `
                  <button onclick="setStudentDay('${d}')" class="px-3 py-1.5 rounded-full font-bold whitespace-nowrap ${state.studentSelectedDay===d?'bg-sky-600 text-white':'bg-slate-100 text-slate-600'}">${d}</button>
                `).join('')}
              </div>

              <div class="space-y-2">
                ${curTimetable.length === 0 ? `<p class="text-slate-400 italic">Không có tiết học nào.</p>` : 
                  curTimetable.map(slot => {
                    const sub = state.subjects.find(s => s.id === slot.subjectId);
                    const t = state.teachers.find(x => x.id === slot.teacherId);
                    return `
                      <div class="border border-slate-200 rounded-xl p-3 flex items-center gap-3 bg-slate-50">
                        <div class="w-12 h-10 bg-sky-600 text-white rounded-lg flex flex-col items-center justify-center font-bold">
                          <span>Tiết ${slot.period}</span>
                        </div>
                        <div>
                          <div class="font-bold text-slate-800 text-sm">${sub?.name}</div>
                          <div class="text-slate-500">Phòng: ${slot.room} | GV: ${t?.name}</div>
                        </div>
                      </div>
                    `;
                  }).join('')
                }
              </div>
            </div>
          `}
        </div>
      `;
    }

    // --- USER EVENT HANDLERS ---
    function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('loginUsername').value;
      const p = document.getElementById('loginPassword').value;
      const user = state.users.find(x => x.username.toLowerCase() === u.trim().toLowerCase());
      if (user && (!p || user.password === p)) {
        state.currentUser = user;
        renderApp();
      } else {
        const err = document.getElementById('loginError');
        err.innerText = 'Tên đăng nhập hoặc mật khẩu không chính xác';
        err.classList.remove('hidden');
      }
    }

    function handleLogout() {
      state.currentUser = null;
      renderApp();
    }

    function quickSwitchUser(userId) {
      const user = state.users.find(x => x.id === userId);
      if (user) {
        state.currentUser = user;
        closeRoleModal();
        renderApp();
      }
    }

    function openRoleModal() {
      const list = document.getElementById('roleModalUserList');
      list.innerHTML = state.users.map(u => {
        const b = getRoleInfo(u.role);
        return `
          <button onclick="quickSwitchUser('${u.id}')" class="w-full text-left p-3 rounded-xl border border-slate-200 bg-slate-50 hover:bg-sky-50 flex items-center gap-3">
            <span class="text-2xl">${b.emoji}</span>
            <div>
              <div class="font-bold text-slate-800 text-xs">${u.name}</div>
              <div class="text-[11px] text-slate-500">${b.label} • tk: ${u.username}</div>
            </div>
          </button>
        `;
      }).join('');
      document.getElementById('roleModal').classList.remove('hidden');
    }

    function closeRoleModal() {
      document.getElementById('roleModal').classList.add('hidden');
    }

    function setAdminTab(tab) {
      state.adminTab = tab;
      renderApp();
    }

    function setAdminClass(clsId) {
      state.adminSelectedClassId = clsId;
      renderApp();
    }

    function setAdminSearch(q) {
      state.adminSearchQuery = q;
      renderApp();
    }

    function toggleSemesterLock(semId) {
      const sem = state.semesters.find(s => s.id === semId);
      if (sem) {
        sem.isLocked = !sem.isLocked;
        renderApp();
      }
    }

    function setTeacherTab(tab) {
      state.teacherTab = tab;
      renderApp();
    }

    function saveStudentGrade(stId) {
      const tx1 = parseFloat(document.getElementById('tx1_' + stId)?.value);
      const tx2 = parseFloat(document.getElementById('tx2_' + stId)?.value);
      const gk = parseFloat(document.getElementById('gk_' + stId)?.value);
      const ck = parseFloat(document.getElementById('ck_' + stId)?.value);

      const activeSem = state.semesters.find(s => s.id === state.activeSemesterId) || state.semesters[0];
      const curSub = state.subjects.find(s => s.id === state.teacherSelectedSubjectId) || state.subjects[0];

      const idx = state.grades.findIndex(g => g.studentId === stId && g.subjectId === curSub.id && g.semesterId === activeSem.id);
      const dtbVal = computeDTB(tx1, tx2, undefined, undefined, gk, ck);

      if (idx >= 0) {
        state.grades[idx] = { ...state.grades[idx], tx1, tx2, gk, ck, dtb: dtbVal };
      } else {
        state.grades.push({ id: 'g_' + Date.now(), studentId: stId, subjectId: curSub.id, semesterId: activeSem.id, tx1, tx2, gk, ck, dtb: dtbVal });
      }

      alert('Đã lưu điểm thành công!');
      renderApp();
    }

    function saveStudentRemark(stId) {
      const txt = document.getElementById('rem_' + stId)?.value;
      const activeSem = state.semesters.find(s => s.id === state.activeSemesterId) || state.semesters[0];
      const idx = state.remarks.findIndex(r => r.studentId === stId && r.semesterId === activeSem.id);
      if (idx >= 0) {
        state.remarks[idx].homeroomRemark = txt;
      } else {
        state.remarks.push({ id: 'rem_' + Date.now(), studentId: stId, semesterId: activeSem.id, homeroomRemark: txt, conduct: 'Tốt', updatedAt: new Date().toLocaleDateString('vi-VN') });
      }
      alert('Đã lưu nhận xét thành công!');
      renderApp();
    }

    function setStudentTab(tab) {
      state.studentTab = tab;
      renderApp();
    }

    function setStudentDay(day) {
      state.studentSelectedDay = day;
      renderApp();
    }

    // INITIAL LAUNCH
    renderApp();
  </script>
</body>
</html>
