  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            salon: {
              bg: '#FBF9F5',
              surface: '#FFFFFF',
              card: '#F5F0EB',
              primary: '#4A6B5D', // Deep sage green
              primaryHover: '#3D5A4D',
              secondary: '#C89F82', // Warm taupe/terracotta accent
              secondaryLight: '#F7F1EC',
              text: '#1C1917',
              muted: '#78716C',
              border: '#E7E0D8'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #F8F6F0;
      color: #1C1917;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    
    .font-serif-accent {
      font-family: 'Playfair Display', serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F8F6F0;
    }
    ::-webkit-scrollbar-thumb {
      background: #D9D1C7;
      border-radius: 10px;
    }
  </style>
</head>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- MOCK INITIAL ADMIN DATA ---
    const INITIAL_APPOINTMENTS = [

      },
      {

        customerName: 'Phạm Bảo Châu',

        services: ['Gội Đầu Dưỡng Sinh Thảo Dược'],
        hairstyle: 'Tư Vấn Trực Tiếp Tại Salon',
        haircolor: 'Giữ Màu Tóc Tự Nhiên',

        time: '15:30',
        totalPrice: 180000,
        status: 'Confirmed',
        createdTime: '10:20 - 09/09'
      },
      {
        id: 'LUMI-4411',
        customerName: 'Vũ Quốc Khánh',
        phone: '0911223344',
        services: ['Cắt & Styling Nam Premium', 'Nhuộm Màu Thời Trang Premium'],
        hairstyle: 'Undercut High Fade Modern',
        haircolor: 'Xanh Đen Âm Trầm (Blue Black)',
        stylist: 'David Nguyễn',
        date: 'Ngày mai, 10/09',
        time: '11:30',
        totalPrice: 810000,
        status: 'Pending',
        createdTime: '11:00 - 09/09'
      }
    ];

    const INITIAL_SERVICES = [
      { id: 'cut-women', name: 'Cắt & Tạo Kiểu Nữ', duration: '45 phút', price: 250000, category: 'Cắt & Tạo Kiểu', active: true, image: 'https://images.unsplash.com/photo-1595476108010-b4d1f102b1b1?auto=format&fit=crop&q=80&w=400' },
      { id: 'cut-men', name: 'Cắt & Styling Nam Premium', duration: '30 phút', price: 160000, category: 'Cắt & Tạo Kiểu', active: true, image: 'https://images.unsplash.com/photo-1622286342621-4bd786c2447c?auto=format&fit=crop&q=80&w=400' },
      { id: 'color-premium', name: 'Nhuộm Màu Thời Trang Premium', duration: '120 phút', price: 650000, category: 'Nhuộm Cao Cấp', active: true, image: 'https://images.unsplash.com/photo-1560869713-7d0a29430803?auto=format&fit=crop&q=80&w=400' },
      { id: 'perm-korean', name: 'Uốn Sóng Lơi Hàn Quốc', duration: '150 phút', price: 750000, category: 'Uốn & Ép', active: true, image: 'https://images.unsplash.com/photo-1605497788044-5a32c7078486?auto=format&fit=crop&q=80&w=400' },
      { id: 'straight-silk', name: 'Ép Tóc Lụa Phủ Bóng Organic', duration: '120 phút', price: 680000, category: 'Uốn & Ép', active: true, image: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&q=80&w=400' },
      { id: 'treatment-keratin', name: 'Phục Hồi Keratin Chuyên Sâu', duration: '60 phút', price: 520000, category: 'Phục Hồi', active: true, image: 'https://images.unsplash.com/photo-1519699047748-de8e457a634e?auto=format&fit=crop&q=80&w=400' },
      { id: 'head-spa', name: 'Gội Đầu Dưỡng Sinh Thảo Dược', duration: '45 phút', price: 180000, category: 'Phục Hồi', active: true, image: 'https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&q=80&w=400' }
    ];

    const INITIAL_STYLISTS = [
      { id: 'alex-tran', name: 'Alex Trần', role: 'Master Stylist', phone: '0981112233', status: 'Available', todayClients: 4, rating: 4.9, avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=300' },
      { id: 'minh-anh', name: 'Minh Anh', role: 'Senior Hair Artist', phone: '0982223344', status: 'Busy', todayClients: 3, rating: 4.8, avatar: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=300' },
      { id: 'david-nguyen', name: 'David Nguyễn', role: 'Barber Specialist', phone: '0983334455', status: 'Busy', todayClients: 5, rating: 4.9, avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=300' },
      { id: 'elena-vu', name: 'Elena Vũ', role: 'Treatment Expert', phone: '0984445566', status: 'Available', todayClients: 2, rating: 5.0, avatar: 'https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&q=80&w=300' }
    ];

    const formatVND = (price) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);

    function AdminApp() {
      // Authentication State
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return sessionStorage.getItem('lumiere_admin_auth') === 'true';
      });
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState('');
      const [showPassword, setShowPassword] = useState(false);

      // Admin Active Tab: 'appointments' | 'services' | 'stylists' | 'reports'
      const [activeTab, setActiveTab] = useState('appointments');
      
      // Main Data States with LocalStorage Persistence
      const [appointments, setAppointments] = useState(() => {
        try {
          const raw = localStorage.getItem('lumiere_appointments');
          return raw ? JSON.parse(raw) : INITIAL_APPOINTMENTS;
        } catch(e) { return INITIAL_APPOINTMENTS; }
      });
      const [services, setServices] = useState(() => {
        try {
          const raw = localStorage.getItem('lumiere_services');
          return raw ? JSON.parse(raw) : INITIAL_SERVICES;
        } catch(e) { return INITIAL_SERVICES; }
      });
      const [stylists, setStylists] = useState(() => {
        try {
          const raw = localStorage.getItem('lumiere_stylists');
          return raw ? JSON.parse(raw) : INITIAL_STYLISTS;
        } catch(e) { return INITIAL_STYLISTS; }
      });

      useEffect(() => {
        try { localStorage.setItem('lumiere_appointments', JSON.stringify(appointments)); } catch(e) {}
      }, [appointments]);

      useEffect(() => {
        try { localStorage.setItem('lumiere_services', JSON.stringify(services)); } catch(e) {}
      }, [services]);

      useEffect(() => {
        try { localStorage.setItem('lumiere_stylists', JSON.stringify(stylists)); } catch(e) {}
      }, [stylists]);

      // Search & Filters for Appointments
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');

      // Modals State
      const [isAddServiceModalOpen, setIsAddServiceModalOpen] = useState(false);
      const [newService, setNewService] = useState({ name: '', price: '', duration: '45 phút', category: 'Cắt & Tạo Kiểu' });

      const [isAddStylistModalOpen, setIsAddStylistModalOpen] = useState(false);
      const [newStylist, setNewStylist] = useState({ name: '', role: 'Senior Hair Artist', phone: '', specialty: 'Cắt Layer & Uốn Hàn Quốc', rating: '5.0' });

      const [editingService, setEditingService] = useState(null);

      const [toastMsg, setToastMsg] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginForm.username.trim() === 'admin' && loginForm.password === '123456') {
          setIsAuthenticated(true);
          sessionStorage.setItem('lumiere_admin_auth', 'true');
          setLoginError('');
          showToast('🔓 Đăng nhập hệ thống Quản Trị thành công!');
        } else {
          setLoginError('Tên đăng nhập hoặc mật khẩu không đúng!');
        }
      };

      const handleLogout = () => {
        if (confirm('Bạn có chắc muốn đăng xuất khỏi trang Quản trị?')) {
          setIsAuthenticated(false);
          sessionStorage.removeItem('lumiere_admin_auth');
          showToast('🔒 Đã đăng xuất thành công');
        }
      };

      // Statistics calculations
      const stats = useMemo(() => {
        const totalRev = appointments
          .filter(a => a.status === 'Completed' || a.status === 'Confirmed' || a.status === 'InProgress')
          .reduce((acc, curr) => acc + curr.totalPrice, 0);

        const pendingCount = appointments.filter(a => a.status === 'Pending').length;
        const confirmedCount = appointments.filter(a => a.status === 'Confirmed' || a.status === 'InProgress').length;
        const completedCount = appointments.filter(a => a.status === 'Completed').length;

        return {
          totalRev,
          pendingCount,
          confirmedCount,
          completedCount,
          totalAppointments: appointments.length
        };
      }, [appointments]);

      // Filtered appointments
      const filteredAppointments = useMemo(() => {
        return appointments.filter(app => {
          const matchQuery = app.customerName.toLowerCase().includes(searchQuery.toLowerCase()) || 
                             app.phone.includes(searchQuery) || 
                             app.id.toLowerCase().includes(searchQuery.toLowerCase());
          const matchStatus = statusFilter === 'All' || app.status === statusFilter;
          return matchQuery && matchStatus;
        });
      }, [appointments, searchQuery, statusFilter]);

      // Update Appointment Status
      const updateStatus = (id, newStatus) => {
        setAppointments(prev => prev.map(a => a.id === id ? { ...a, status: newStatus } : a));
        showToast(`Đã cập nhật trạng thái đơn ${id} thành: ${newStatus}`);
      };

      // Delete Appointment
      const deleteAppointment = (id) => {
        if (confirm(`Bạn có chắc chắn muốn xóa lịch hẹn ${id}?`)) {
          setAppointments(prev => prev.filter(a => a.id !== id));
          showToast(`Đã xóa lịch hẹn ${id}`);
        }
      };

      // Add New Service Handler
      const handleAddService = (e) => {
        e.preventDefault();
        if (!newService.name || !newService.price) {
          showToast('Vui lòng nhập đầy đủ thông tin dịch vụ!');
          return;
        }

        const newId = 'serv-' + Date.now();
        const created = {
          id: newId,
          name: newService.name,
          price: parseInt(newService.price),
          duration: newService.duration,
          category: newService.category,
          active: true
        };

        setServices(prev => [created, ...prev]);
        setNewService({ name: '', price: '', duration: '45 phút', category: 'Cắt & Tạo Kiểu' });
        setIsAddServiceModalOpen(false);
        showToast('Đã thêm dịch vụ mới thành công!');
      };

      // Update Existing Service Price & Info Handler
      const handleUpdateService = (e) => {
        e.preventDefault();
        if (!editingService) return;

        setServices(prev => prev.map(s => s.id === editingService.id ? editingService : s));
        const updatedName = editingService.name;
        const updatedPrice = editingService.price;
        setEditingService(null);
        showToast(`🎉 Đã cập nhật giá dịch vụ "${updatedName}" thành ${formatVND(updatedPrice)}!`);
      };

      // Add New Stylist Handler
      const handleAddStylist = (e) => {
        e.preventDefault();
        if (!newStylist.name.trim()) {
          showToast('Vui lòng nhập tên thợ!');
          return;
        }

        const newId = 'stylist-' + Date.now();
        const created = {
          id: newId,
          name: newStylist.name,
          role: newStylist.role,
          phone: newStylist.phone || '098' + Math.floor(1000000 + Math.random() * 9000000),
          specialty: newStylist.specialty,
          status: 'Available',
          todayClients: 0,
          rating: parseFloat(newStylist.rating) || 5.0
        };

        setStylists(prev => [...prev, created]);
        setNewStylist({ name: '', role: 'Senior Hair Artist', phone: '', specialty: 'Cắt Layer & Uốn Hàn Quốc', rating: '5.0' });
        setIsAddStylistModalOpen(false);
        showToast(`🎉 Đã thêm thợ ${created.name} thành công!`);
      };

      // Toggle Service Active Status
      const toggleServiceActive = (id) => {
        setServices(prev => prev.map(s => s.id === id ? { ...s, active: !s.active } : s));
        showToast('Đã cập nhật trạng thái dịch vụ!');
      };

      // Toggle Stylist Status (Available / Busy)
      const toggleStylistStatus = (id) => {
        setStylists(prev => prev.map(st => {
          if (st.id === id) {
            const nextStatus = st.status === 'Available' ? 'Busy' : 'Available';
            return { ...st, status: nextStatus };
          }
          return st;
        }));
        showToast('Đã cập nhật trạng thái thợ làm tóc!');
      };

      // RENDER LOGIN SCREEN IF NOT AUTHENTICATED
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-[#F8F6F0] flex items-center justify-center p-4">
            
            {/* TOAST NOTIFICATION */}
            {toastMsg && (
              <div className="fixed top-5 right-5 z-50 bg-stone-900 text-stone-100 px-4 py-3 rounded-2xl shadow-xl text-sm font-medium flex items-center gap-2">
                <span>⚡</span>
                <span>{toastMsg}</span>
              </div>
            )}

            <div className="bg-white max-w-md w-full rounded-3xl border border-stone-200 shadow-xl overflow-hidden p-8 space-y-6">
              
              {/* Header Logo */}
              <div className="text-center space-y-2">
                <div className="w-14 h-14 rounded-full bg-salon-primary text-white flex items-center justify-center font-serif text-2xl font-bold mx-auto shadow-md">
                  L
                </div>
                <h1 className="font-serif-accent text-2xl font-bold text-stone-900">LUMIÈRE Hair Studio</h1>
                <span className="text-xs uppercase tracking-widest font-semibold text-salon-secondary bg-salon-secondaryLight px-3 py-1 rounded-full inline-block">
                  Cổng Đăng Nhập Quản Trị Viên
                </span>
              </div>

              {/* Login Form */}
              <form onSubmit={handleLogin} className="space-y-4 text-xs">
                
                {loginError && (
                  <div className="bg-rose-50 text-rose-700 p-3 rounded-xl border border-rose-200 font-semibold text-center">
                    ⚠️ {loginError}
                  </div>
                )}

                <div className="space-y-1.5">
                  <label className="font-semibold text-stone-700">Tên Đăng Nhập / Username</label>
                  <input 
                    type="text" 
                    required
                    placeholder="Nhập tên đăng nhập"
                    value={loginForm.username}
                    onChange={(e) => setLoginForm({...loginForm, username: e.target.value})}
                    className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-salon-primary/40 text-sm bg-salon-bg"
                  />
                </div>

                <div className="space-y-1.5 relative">
                  <label className="font-semibold text-stone-700">Mật Khẩu / Password</label>
                  <div className="relative">
                    <input 
                      type={showPassword ? 'text' : 'password'}
                      required
                      placeholder="Nhập mật khẩu"
                      value={loginForm.password}
                      onChange={(e) => setLoginForm({...loginForm, password: e.target.value})}
                      className="w-full px-4 py-3 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-salon-primary/40 text-sm bg-salon-bg pr-10"
                    />
                    <button
                      type="button"
                      onClick={() => setShowPassword(!showPassword)}
                      className="absolute right-3 top-3 text-stone-400 hover:text-stone-700 text-xs font-semibold"
                    >
                      {showPassword ? 'Ẩn' : 'Hiện'}
                    </button>
                  </div>
                </div>

                <button
                  type="submit"
                  className="w-full bg-salon-primary hover:bg-salon-primaryHover text-white py-3.5 rounded-2xl font-bold text-sm shadow-md transition flex items-center justify-center gap-2"
                >
                  <span>Đăng Nhập Quản Trị</span>
                  <i data-lucide="arrow-right" className="w-4 h-4"></i>
                </button>
              </form>

              {/* Back to Client Site */}
              <div className="pt-4 border-t border-stone-100 text-center">
                <a href="index.html" className="text-xs text-stone-500 hover:text-stone-900 font-semibold hover:underline">
                  ← Quay về trang dành cho khách hàng
                </a>
              </div>

            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-[#F8F6F0]">
          
          {/* TOAST NOTIFICATION */}
          {toastMsg && (
            <div className="fixed top-5 right-5 z-50 bg-stone-900 text-stone-100 px-4 py-3 rounded-2xl shadow-xl text-sm font-medium flex items-center gap-2">
              <span>⚡</span>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* SIDEBAR NAVIGATION */}
          <aside className="w-full md:w-64 bg-stone-900 text-stone-300 flex-shrink-0 flex flex-col justify-between p-5">
            <div className="space-y-6">
              
              {/* Brand Logo */}
              <div className="flex items-center gap-3 pb-6 border-b border-stone-800">
                <div className="w-10 h-10 rounded-full bg-salon-primary text-white flex items-center justify-center font-serif text-xl font-bold">
                  L
                </div>
                <div>
                  <h1 className="font-serif-accent text-lg font-bold text-white leading-none">LUMIÈRE</h1>
                  <span className="text-[10px] tracking-widest uppercase text-salon-secondary font-semibold">Admin Portal</span>
                </div>
              </div>

              {/* Navigation Items */}
              <nav className="space-y-1">
                {[
                  { key: 'appointments', label: 'Quản Lý Lịch Hẹn', icon: 'calendar', badge: stats.pendingCount },
                  { key: 'services', label: 'Dịch Vụ & Bảng Giá', icon: 'scissors', badge: services.length },
                  { key: 'stylists', label: 'Đội Ngũ Stylist', icon: 'users', badge: stylists.length },
                  { key: 'reports', label: 'Báo Cáo Doanh Thu', icon: 'bar-chart-3', badge: null }
                ].map((item) => (
                  <button
                    key={item.key}
                    onClick={() => setActiveTab(item.key)}
                    className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl text-xs font-semibold transition-all ${
                      activeTab === item.key
                        ? 'bg-salon-primary text-white shadow-md'
                        : 'text-stone-400 hover:bg-stone-800 hover:text-stone-200'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <i data-lucide={item.icon} className="w-4 h-4"></i>
                      <span>{item.label}</span>
                    </div>
                    {item.badge !== null && item.badge > 0 && (
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                        activeTab === item.key ? 'bg-white text-salon-primary' : 'bg-stone-800 text-stone-300'
                      }`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>

            </div>

            {/* Bottom Actions: Back to Website & Logout */}
            <div className="pt-6 border-t border-stone-800 space-y-2">

                        <option value="Barber Specialist">Barber Specialist</option>
                        <option value="Color Specialist">Color Specialist</option>
                        <option value="Treatment Expert">Treatment Expert</option>
                      </select>
                    </div>

                    <div className="space-y-1">
                      <label className="font-semibold text-stone-700">Số Điện Thoại</label>
                      <input 
                        type="tel" 
                        placeholder="0988 777 666"
                        value={newStylist.phone} 
                        onChange={(e) => setNewStylist({...newStylist, phone: e.target.value})}
                        className="w-full p-3 rounded-xl border focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg"
                      />
                    </div>
                  </div>

                  <div className="space-y-1">
                    <label className="font-semibold text-stone-700">Sở Trường / Chuyên Môn</label>
                    <input 
                      type="text" 
                      placeholder="Ví dụ: Chuyên Uốn Sóng & Nhuộm Balayage"
                      value={newStylist.specialty} 
                      onChange={(e) => setNewStylist({...newStylist, specialty: e.target.value})}
                      className="w-full p-3 rounded-xl border focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg"
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="font-semibold text-stone-700">Đánh Giá Ban Đầu (Số sao)</label>
                    <select 
                      value={newStylist.rating}
                      onChange={(e) => setNewStylist({...newStylist, rating: e.target.value})}
                      className="w-full p-3 rounded-xl border focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg"
                    >
                      <option value="5.0">5.0 ★ (Xuất sắc)</option>
                      <option value="4.9">4.9 ★ (Rất tốt)</option>
                      <option value="4.8">4.8 ★ (Tốt)</option>
                    </select>
                  </div>

                  <div className="pt-3 flex gap-2">
                    <button 
                      type="button" 
                      onClick={() => setIsAddStylistModalOpen(false)}
                      className="flex-1 bg-stone-100 hover:bg-stone-200 text-stone-700 py-3 rounded-xl font-semibold"
                    >
                      Hủy bỏ
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 bg-salon-primary hover:bg-salon-primaryHover text-white py-3 rounded-xl font-semibold shadow"
                    >
                      Lưu Stylist Mới
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 3: CHỈNH SỬA GIÁ DỊCH VỤ */}
          {editingService && (
            <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center pb-3 border-b">
                  <div>
                    <h3 className="font-bold text-stone-900 text-base">Chỉnh Sửa Giá Dịch Vụ</h3>
                    <p className="text-[11px] text-stone-500">{editingService.name}</p>
                  </div>
                  <button onClick={() => setEditingService(null)} className="text-stone-400 hover:text-stone-600 font-bold">✖</button>
                </div>

                <form onSubmit={handleUpdateService} className="space-y-4 text-xs">
                  <div className="space-y-1">
                    <label className="font-semibold text-stone-700">Tên Dịch Vụ</label>
                    <input 
                      type="text" 
                      required 
                      value={editingService.name} 
                      onChange={(e) => setEditingService({...editingService, name: e.target.value})}
                      className="w-full p-3 rounded-xl border focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div className="space-y-1">
                      <label className="font-semibold text-stone-700">Giá Niêm Yết Mới (VNĐ) <span className="text-red-500">*</span></label>
                      <input 
                        type="number" 
                        required 
                        placeholder="Ví dụ: 300000"
                        value={editingService.price} 
                        onChange={(e) => setEditingService({...editingService, price: parseInt(e.target.value) || 0})}
                        className="w-full p-3 rounded-xl border focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg font-bold text-salon-primary"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="font-semibold text-stone-700">Thời Gian Dự Kiến</label>
                      <select 
                        value={editingService.duration}
                        onChange={(e) => setEditingService({...editingService, duration: e.target.value})}
                        className="w-full p-3 rounded-xl border focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg"
                      >
                        <option value="30 phút">30 phút</option>
                        <option value="45 phút">45 phút</option>
                        <option value="60 phút">60 phút</option>
                        <option value="90 phút">90 phút</option>
                        <option value="120 phút">120 phút</option>
                        <option value="150 phút">150 phút</option>
                      </select>
                    </div>
                  </div>

                  <div className="space-y-1">
                    <label className="font-semibold text-stone-700">Phân Loại Danh Mục</label>
                    <select 
                      value={editingService.category}
                      onChange={(e) => setEditingService({...editingService, category: e.target.value})}
                      className="w-full p-3 rounded-xl border focus:outline-none focus:ring-2 focus:ring-salon-primary/40 bg-salon-bg"
                    >
                      <option value="Cắt & Tạo Kiểu">Cắt & Tạo Kiểu</option>
                      <option value="Nhuộm Cao Cấp">Nhuộm Cao Cấp</option>
                      <option value="Uốn & Ép">Uốn & Ép</option>
                      <option value="Phục Hồi">Phục Hồi</option>
                    </select>
                  </div>

                  <div className="pt-3 flex gap-2">
                    <button 
                      type="button" 
                      onClick={() => setEditingService(null)}
                      className="flex-1 bg-stone-100 hover:bg-stone-200 text-stone-700 py-3 rounded-xl font-semibold"
                    >
                      Hủy bỏ
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 bg-salon-primary hover:bg-salon-primaryHover text-white py-3 rounded-xl font-semibold shadow"
                    >
                      Lưu Cập Nhật Giá
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<AdminApp />);
  </script>
</body>
</html>
