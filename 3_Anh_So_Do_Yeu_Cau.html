<!DOCTYPE html>

        .img-preview { width: 100%; background: #ffffff; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; margin-top: 15px; }

<body>
    <div class="container">
        <h1 class="text-center text-warning fw-bold mb-4"><i class="fa-solid fa-images me-2"></i> BỘ 3 HÌNH ẢNH SƠ ĐỒ HỆ THỐNG YÊU CẦU</h1>
        
        <!-- 1. 6.1 SƠ ĐỒ TRÌNH TỰ MƯỢN SÁCH -->
        <div class="card-diagram">

                <h3>1. 6.1 Sơ đồ Trình tự (Sequence Diagram): Quy trình Mượn Sách & Khóa Kho Tự Động</h3>
                <a href="assets/so_do_trinh_tu_muon_sach.png" download class="btn btn-primary btn-sm"><i class="fa-solid fa-download"></i> Tải Ảnh HD</a>

        <div class="card-diagram">

                <a href="assets/so_do_quan_he_thuc_the_erd.png" download class="btn btn-primary btn-sm"><i class="fa-solid fa-download"></i> Tải Ảnh HD</a>
