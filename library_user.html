    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_BASE = 'library_api.php';

        function BookCover({ src, title, author, category, style, className }) {
            const [imgError, setImgError] = useState(false);

            useEffect(() => {
                setImgError(false);
            }, [src]);

            const isDataUri = src && src.startsWith('data:image');
            
            if (src && !imgError && !isDataUri) {
                return (
                    <img 
                        src={src} 
                        className={className} 
                        style={{
                            width: '100%',
                            height: '210px',
                            objectFit: 'cover',
                            borderRadius: '12px',
                            boxShadow: '0 8px 20px rgba(0,0,0,0.12)',
                            background: '#ffffff',
                            border: '1px solid #e2e8f0',
                            display: 'block',
                            ...style
                        }} 
                        alt={title} 
                        onError={() => setImgError(true)} 
                    />
                );
            }

            let bgGrad = 'linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%)';
            let iconClass = 'fas fa-book-open';
            let catBadge = 'THƯ VIỆN SỐ';

            const cleanCat = String(category || '');
            if (cleanCat.includes('Truyện') || cleanCat.includes('Manga') || cleanCat.includes('Comic')) {
                bgGrad = 'linear-gradient(135deg, #db2777 0%, #831843 100%)';
                iconClass = 'fas fa-paint-brush';
                catBadge = 'MANGA & COMIC';
            } else if (cleanCat.includes('Công Nghệ') || cleanCat.includes('Lập Trình') || cleanCat.includes('IT')) {
                bgGrad = 'linear-gradient(135deg, #0f172a 0%, #0284c7 100%)';
                iconClass = 'fas fa-laptop-code';
                catBadge = 'CÔNG NGHỆ IT';
            } else if (cleanCat.includes('Kỹ Năng') || cleanCat.includes('Kinh Tế')) {
                bgGrad = 'linear-gradient(135deg, #059669 0%, #047857 100%)';
                iconClass = 'fas fa-bolt';
                catBadge = 'KỸ NĂNG & KINH TẾ';
            } else if (cleanCat.includes('Tiểu Thuyết') || cleanCat.includes('Trinh Thám')) {
                bgGrad = 'linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%)';
                iconClass = 'fas fa-search-location';
                catBadge = 'TIỂU THUYẾT';
            }

            return (
                <div 
                    className={className} 
                    style={{
                        background: bgGrad,
                        borderRadius: '12px',
                        position: 'relative',
                        display: 'flex',
                        flexDirection: 'column',
                        alignItems: 'center',
                        justify: 'space-between',
                        padding: '16px 12px',
                        color: '#ffffff',
                        boxShadow: '0 8px 20px rgba(0,0,0,0.18)',
                        boxSizing: 'border-box',
                        overflow: 'hidden',
                        userSelect: 'none',
                        ...style
                    }}
                >
                    <div style={{
                        position: 'absolute', top: 0, left: 0, bottom: 0, width: '10px',
                        background: 'linear-gradient(to right, rgba(255,255,255,0.4), rgba(0,0,0,0.15))'
                    }}></div>

                    <div style={{
                        position: 'absolute', top: '8px', left: '16px', right: '8px', bottom: '8px',
                        border: '1px solid rgba(255,255,255,0.25)', borderRadius: '6px', pointerEvents: 'none'
                    }}></div>

                    <div style={{
                        background: 'rgba(255,255,255,0.2)',
                        backdropFilter: 'blur(4px)',
                        padding: '3px 8px',
                        borderRadius: '10px',
                        fontSize: '0.62rem',
                        fontWeight: 800,
                        letterSpacing: '0.5px',
                        textTransform: 'uppercase',
                        marginTop: '2px',
                        maxWidth: '85%',
                        overflow: 'hidden',
                        whiteSpace: 'nowrap',
                        textOverflow: 'ellipsis'
                    }}>
                        {catBadge}
                    </div>

                    <div style={{fontSize: '1.8rem', margin: '4px 0', opacity: 0.95}}>
                        <i className={iconClass}></i>
                    </div>

                    <div style={{
                        fontWeight: 800,
                        fontSize: '0.82rem',
                        textAlign: 'center',
                        lineHeight: 1.25,
                        textShadow: '0 2px 4px rgba(0,0,0,0.3)',
                        display: '-webkit-box',
                        WebkitLineClamp: 3,
                        WebkitBoxOrient: 'vertical',
                        overflow: 'hidden',
                        width: '100%',
                        padding: '0 4px'
                    }}>
                        {title}
                    </div>

                    <div style={{
                        fontSize: '0.68rem',
                        opacity: 0.9,
                        fontWeight: 600,
                        textAlign: 'center',
                        borderTop: '1px solid rgba(255,255,255,0.25)',
                        paddingTop: '4px',
                        width: '100%',
                        marginTop: '4px',
                        whiteSpace: 'nowrap',
                        overflow: 'hidden',
                        textOverflow: 'ellipsis'
                    }}>
                        {author || 'Tác giả'}
                    </div>
                </div>
            );
        }

        function getSVGBookCover(title, author, category) {
            const cleanTitle = String(title || 'Sách Thư Viện').replace(/[<>&"]/g, '');
            const cleanAuthor = String(author || 'Tác giả').replace(/[<>&"]/g, '');
            const cleanCategory = String(category || 'Sách').replace(/[<>&"]/g, '');

            let bgGrad = ['#3b82f6', '#1d4ed8'];
            let icon = '📖';
            let catBadge = 'THƯ VIỆN SỐ';

            if (cleanCategory.includes('Truyện') || cleanCategory.includes('Manga') || cleanCategory.includes('Comic')) {
                bgGrad = ['#ec4899', '#831843'];
                icon = '🎨';
                catBadge = 'MANGA & COMIC';
            } else if (cleanCategory.includes('Công Nghệ') || cleanCategory.includes('Lập Trình') || cleanCategory.includes('IT')) {
                bgGrad = ['#0f172a', '#0284c7'];
                icon = '💻';
                catBadge = 'CÔNG NGHỆ IT';
            } else if (cleanCategory.includes('Kỹ Năng') || cleanCategory.includes('Kinh Tế')) {
                bgGrad = ['#10b981', '#047857'];
                icon = '⚡';
                catBadge = 'KỸ NĂNG & KINH TẾ';
            } else if (cleanCategory.includes('Tiểu Thuyết') || cleanCategory.includes('Trinh Thám')) {
                bgGrad = ['#8b5cf6', '#4c1d95'];
                icon = '🔍';
                catBadge = 'TIỂU THUYẾT';
            }

            const words = cleanTitle.split(' ');
            const lines = [];
            let currentLine = '';
            words.forEach(w => {
                if ((currentLine + ' ' + w).length > 16) {
                    if (currentLine) lines.push(currentLine.trim());
                    currentLine = w;
                } else {
                    currentLine += ' ' + w;
                }
            });
            if (currentLine.trim()) lines.push(currentLine.trim());
            const finalLines = lines.slice(0, 4);

            const titleY = 200 - (finalLines.length * 10);
            const titleXml = finalLines.map((l, idx) => `<text x="150" y="${titleY + (idx * 24)}" fill="#ffffff" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">${l}</text>`).join('');

            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
                <defs>
                    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="${bgGrad[0]}"/>
                        <stop offset="100%" stop-color="${bgGrad[1]}"/>
                    </linearGradient>
                    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
                        <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
                    </linearGradient>
                </defs>
                <rect width="300" height="420" rx="12" fill="url(#bg)"/>
                <rect x="0" y="0" width="18" height="420" fill="url(#spine)"/>
                <rect x="30" y="24" width="240" height="372" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
                <rect x="45" y="45" width="140" height="24" rx="12" fill="#ffffff" fill-opacity="0.2"/>
                <text x="115" y="61" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle" letter-spacing="1">${catBadge}</text>
                <text x="150" y="135" font-size="48" text-anchor="middle">${icon}</text>
                ${titleXml}
                <line x1="60" y1="340" x2="240" y2="340" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
                <text x="150" y="365" fill="#f8fafc" font-size="12" font-weight="600" font-family="sans-serif" text-anchor="middle">Tác giả: ${cleanAuthor.slice(0, 24)}</text>
                <text x="150" y="390" fill="#93c5fd" font-size="10" font-family="sans-serif" text-anchor="middle">★ THƯ VIỆN SỐ ENTERPRISE ★</text>
            </svg>`;

            return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        }

        function handleCoverError(e, title, author, category) {
            e.target.onerror = null;
            e.target.src = getSVGBookCover(title, author, category);
        }

        function ReaderApp() {
            // Main Tabs: 'home', 'catalog', 'elibrary', 'events', 'manga_services', 'my_account'
            const [activeMainTab, setActiveMainTab] = useState('home');

            // Search & Advanced Filter state
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('Tất cả');
            const [filterYear, setFilterYear] = useState('Tất cả');
            const [filterLanguage, setFilterLanguage] = useState('Tất cả');
            const [filterStatus, setFilterStatus] = useState('all');
            const [sortBy, setSortBy] = useState('newest');

            // Core Data states
            const [books, setBooks] = useState([]);
            const [categories, setCategories] = useState([]);
            const [currentReader, setCurrentReader] = useState(null);
            const [walletInfo, setWalletInfo] = useState(null);
            const [myOrders, setMyOrders] = useState([]);
            const [myReservations, setMyReservations] = useState([]);
            const [mangaServices, setMangaServices] = useState([]);
            const [myMangaOrders, setMyMangaOrders] = useState([]);

            // Enterprise Feature Data states
            const [digitalDocs, setDigitalDocs] = useState([]);
            const [events, setEvents] = useState([]);
            const [recommendations, setRecommendations] = useState([]);
            const [notifications, setNotifications] = useState([]);
            const [showNotifDrawer, setShowNotifDrawer] = useState(false);

            // LIVE CHAT WITH ADMIN STATE
            const [showLiveChat, setShowLiveChat] = useState(false);
            const [chatMessages, setChatMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');

            // PDF Reader Modal state
            const [activePdfDoc, setActivePdfDoc] = useState(null);
            const [pdfPage, setPdfPage] = useState(1);
            const [pdfZoom, setPdfZoom] = useState(100);

            // VietQR Payment Modal state
            const [showVietQrModal, setShowVietQrModal] = useState(false);
            const [topupAmountInput, setTopupAmountInput] = useState(200000);

            // Book Donation Modal state
            const [showDonationModal, setShowDonationModal] = useState(false);
            const [donationForm, setDonationForm] = useState({
                ten_sach: '', tac_gia: '', me_ta: '', danh_muc: 'Tiểu thuyết', tinh_trang: 'Mới 95%', ghi_chu_lien_he: 'Đà Nẵng'
            });

            // Detail Modal state
            const [detailBook, setDetailBook] = useState(null);
            const [bookReviews, setBookReviews] = useState([]);
            const [newReviewStars, setNewReviewStars] = useState(5);
            const [newReviewComment, setNewReviewComment] = useState('');

            // Book Rental Modal
            const [checkoutBook, setCheckoutBook] = useState(null);
            const [rentDays, setRentDays] = useState(7);
            const [deliveryMethod, setDeliveryMethod] = useState('Giao tận nơi');

            // Manga Order Modal
            const [orderService, setOrderService] = useState(null);
            const [selectedTier, setSelectedTier] = useState('Gói Tiêu Chuẩn');
            const [orderNote, setOrderNote] = useState('');

            // Auth Modals
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [showRegModal, setShowRegModal] = useState(false);
            const [loginForm, setLoginForm] = useState({ username: 'khainguyen@gmail.com', password: '123' });
            const [regForm, setRegForm] = useState({ ho_ten: '', email: '', so_dien_thoai: '', password: '', dia_chi: 'Đà Nẵng' });

            // AUDIOBOOK PLAYER STATE
            const [audiobooks, setAudiobooks] = useState([]);
            const [playingTrack, setPlayingTrack] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [audioSpeed, setAudioSpeed] = useState(1.0);
            const [selectedChapter, setSelectedChapter] = useState(0);

            // AI SUMMARIZER STATE
            const [showAiModal, setShowAiModal] = useState(false);
            const [aiBookTitle, setAiBookTitle] = useState('');
            const [aiSummary, setAiSummary] = useState(null);
            const [aiLoading, setAiLoading] = useState(false);
            const [aiChatInput, setAiChatInput] = useState('');
            const [aiChatLog, setAiChatLog] = useState([]);

            useEffect(() => {
                const savedUser = localStorage.getItem('reader_user');
                if (savedUser) {
                    try { setCurrentReader(JSON.parse(savedUser)); } catch (e) {}
                }
                fetchCategories();
                fetchBooks();
                fetchMangaServices();
                fetchDigitalDocs();
                fetchEvents();
                fetchAudiobooks();
            }, []);

            const fetchAudiobooks = async () => {
                try {
                    const res = await fetch(`${API_BASE}?action=get_audiobooks`);
                    const json = await res.json();
                    if (json.status === 'success') {
                        setAudiobooks(json.data.audiobooks);
                        if (json.data.audiobooks.length > 0 && !playingTrack) {
                            setPlayingTrack(json.data.audiobooks[0]);
                        }
                    }
                } catch (e) { console.error(e); }
            };

            const handlePlayAudiobook = (track) => {
                if (playingTrack && playingTrack.id === track.id) {
                    if (isPlaying) {
                        if ('speechSynthesis' in window) window.speechSynthesis.pause();
                        setIsPlaying(false);
                    } else {
                        if ('speechSynthesis' in window && window.speechSynthesis.paused) {
                            window.speechSynthesis.resume();
                        } else {
                            speakSample(track.sample_text);
                        }
                        setIsPlaying(true);
                    }
                } else {
                    setPlayingTrack(track);
                    setIsPlaying(true);
                    speakSample(track.sample_text);
                }
            };

            const speakSample = (text) => {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN';
                utterance.rate = audioSpeed;
                utterance.onend = () => setIsPlaying(false);
                utterance.onerror = () => setIsPlaying(false);
                window.speechSynthesis.speak(utterance);
            };

            const handleOpenAiSummary = async (bookTitle) => {
                setAiBookTitle(bookTitle);
                setShowAiModal(true);
                setAiLoading(true);
                try {
                    const res = await fetch(`${API_BASE}?action=get_ai_summary&book_title=${encodeURIComponent(bookTitle)}`);
                    const json = await res.json();
                    if (json.status === 'success') {
                        setAiSummary(json.data.summary);
                        setAiChatLog([
                            { sender: 'ai', text: `🤖 Chào bạn! Mình là Trợ Lý AI của Thư Viện Số. Cuốn sách "${bookTitle}" thật tuyệt vời! Bạn có thắc mắc gì cần giải đáp không?` }
                        ]);
                    }
                } catch (e) { alert('Lỗi tải tóm tắt AI'); }
                finally { setAiLoading(false); }
            };

            const handleSendAiChat = (e) => {
                e.preventDefault();
                if (!aiChatInput.trim()) return;
                const userMsg = aiChatInput.trim();
                setAiChatLog(prev => [...prev, { sender: 'user', text: userMsg }]);
                setAiChatInput('');
                setTimeout(() => {
                    let reply = `Dựa trên phân tích cuốn sách "${aiBookTitle}", bài học quan trọng nhất là bạn nên tập trung vào quy trình và hành động nhỏ mỗi ngày.`;
                    if (userMsg.toLowerCase().includes('áp dụng') || userMsg.toLowerCase().includes('làm sao')) {
                        reply = `Để áp dụng thành công: Hãy chọn 1 mục tiêu đơn giản (dưới 2 phút) và thực hiện ngay sau một thói quen cố định sẵn có!`;
                    } else if (userMsg.toLowerCase().includes('tác giả') || userMsg.toLowerCase().includes('ai viết')) {
                        reply = `Tác giả cuốn sách là chuyên gia hàng đầu, giúp kết hợp khoa học tâm lý học và tư duy thực tiễn.`;
                    }
                    setAiChatLog(prev => [...prev, { sender: 'ai', text: reply }]);
                }, 500);
            };

            useEffect(() => {
                fetchBooks();
            }, [searchQuery, selectedCategory, filterYear, filterLanguage, filterStatus, sortBy]);

            useEffect(() => {
                if (currentReader) {
                    fetchWallet(currentReader.id);
                    fetchMyOrders(currentReader.id);
                    fetchMyReservations(currentReader.id);
                    fetchMyMangaOrders(currentReader.id);
                    fetchRecommendations(currentReader.id);
                    fetchNotifications(currentReader.id);
                }
            }, [currentReader]);

            // LIVE CHAT REAL-TIME POLLING EFFECT
            useEffect(() => {
                let interval;
                if (showLiveChat && currentReader) {
                    fetchChatMessages(currentReader.id);
                    interval = setInterval(() => {
                        fetchChatMessages(currentReader.id);
                    }, 3000);
                }
                return () => { if (interval) clearInterval(interval); };
            }, [showLiveChat, currentReader]);

            const fetchChatMessages = async (readerId) => {
                try {
                    const res = await fetch(`${API_BASE}?action=get_chat_messages&reader_id=${readerId}`);
                    const json = await res.json();
                    if (json.status === 'success') setChatMessages(json.data.messages || []);
                } catch (e) { console.error(e); }
            };

            const handleSendChatMessage = async (e) => {
                e.preventDefault();
                if (!currentReader) return;
                if (!chatInput.trim()) return;

                try {
                    const res = await fetch(`${API_BASE}?action=send_chat_message`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            reader_id: currentReader.id,
                            sender_type: 'reader',
                            message_text: chatInput.trim()
                        })
                    });
                    const json = await res.json();
                    if (json.status === 'success') {
                        setChatInput('');
                        setChatMessages(json.data.messages || []);
                    }
                } catch (e) { alert('Lỗi gửi tin nhắn'); }
            };

            const fetchCategories = async () => {
                try {
                    const res = await fetch(`${API_BASE}?action=get_categories`);
                    const json = await res.json();
                    if (json.status === 'success') setCategories(json.data.categories);
                } catch (e) { console.error(e); }
            };

            const fetchBooks = async () => {
                try {
                    const query = `${API_BASE}?action=get_books&search=${encodeURIComponent(searchQuery)}&category_id=${encodeURIComponent(selectedCategory)}&nam_xuat_ban=${encodeURIComponent(filterYear)}&ngon_ngu=${encodeURIComponent(filterLanguage)}&trang_thai=${filterStatus}&sort=${sortBy}`;
                    const res = await fetch(query);
                    const json = await res.json();
                    if (json.status === 'success') setBooks(json.data.books);
                } catch (e) { console.error(e); }
            };

            const fetchMangaServices = async () => {
                try {
                    const res = await fetch(`${API_BASE}?action=get_manga_services`);
                    const json = await res.json();
                    if (json.status === 'success') setMangaServices(json.data.services);

                    const json = await res.json();
                    if (json.status === 'success') setDigitalDocs(json.data.digital_documents);

                try {

                    const json = await res.json();
                    if (json.status === 'success') setEvents(json.data.events);
                } catch (e) { console.error(e); }

                    const res = await fetch(`${API_BASE}?action=get_orders&reader_id=${readerId}`);
                    const json = await res.json();

                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },

            // Checkout Rental Handler
            const handleConfirmBookCheckout = async () => {
                if (!currentReader) {
                    setShowLoginModal(true);
                    return alert('Vui lòng đăng nhập để đặt thuê sách!');

                if (!checkoutBook) return;

                const endDateObj = new Date();
                endDateObj.setDate(endDateObj.getDate() + parseInt(rentDays));
                const endDate = endDateObj.toISOString().split('T')[0];

                try {
                    const res = await fetch(`${API_BASE}?action=client_checkout`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            reader_id: currentReader.id,
                            book_id: checkoutBook.id,
                            ngay_bat_dau: startDate,
                            ngay_ket_thuc: endDate,
                            phuong_thuc_nhan: deliveryMethod

                    const json = await res.json();
                    alert(json.message);
                    if (json.status === 'success') {
                        setCheckoutBook(null);
                        fetchWallet(currentReader.id);
                        fetchMyOrders(currentReader.id);
                        fetchBooks();
                        setActiveMainTab('my_account');
                    }
                } catch (e) { alert('Lỗi đặt thuê sách'); }
            };

            const handleExtendRental = async (orderId) => {
                try {
                    const res = await fetch(`${API_BASE}?action=client_extend_rental`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: orderId })
                    });
                    const json = await res.json();
                    alert(json.message);
                    if (json.status === 'success') fetchMyOrders(currentReader.id);
                } catch (e) { alert('Lỗi gia hạn'); }
            };

            // Order Manga Service
            const handleConfirmMangaOrder = async () => {

                    setShowLoginModal(true);
                    return alert('Vui lòng đăng nhập để đặt vẽ Manga!');
                }
                if (!orderService) return;

                try {
                    const res = await fetch(`${API_BASE}?action=order_manga_service`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            reader_id: currentReader.id,
                            service_id: orderService.id,
                            package_tier: selectedTier,
                            note: orderNote
                        })
                    });
                    const json = await res.json();
                    alert(json.message);
                    if (json.status === 'success') {
                        setOrderService(null);
                        fetchWallet(currentReader.id);
                        fetchMyMangaOrders(currentReader.id);
                        setActiveMainTab('my_account');
                    }
                } catch (e) { alert('Lỗi đặt dịch vụ vẽ'); }
            };

            // Topup Handler (VietQR Simulation)
            const handleConfirmVietQrTopup = async () => {
                if (!currentReader) return;
                const amount = Number(topupAmountInput);
                if (isNaN(amount) || amount <= 0) return alert('Vui lòng nhập số tiền hợp lệ!');

                try {
                    const res = await fetch(`${API_BASE}?action=wallet_topup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ reader_id: currentReader.id, so_tien: amount })
                    });
                    const json = await res.json();
                    alert(json.message + ' (Cổng VNPAY/VietQR xác nhận thành công!)');
                    if (json.status === 'success') {
                        setShowVietQrModal(false);
                        fetchWallet(currentReader.id);

            return (

                            <div className="modal-card" style={{maxWidth: '480px'}}>
                                <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '16px'}}>
                                    <h3 style={{fontSize: '1.15rem', fontWeight: 800}}>Xác Nhận Đặt Thuê Sách Qua Ví</h3>
                                    <button style={{background: 'none', border: 'none', fontSize: '1.4rem', cursor: 'pointer'}} onClick={() => setCheckoutBook(null)}>&times;</button>
                                </div>

                                <div style={{marginBottom: '14px'}}>
                                    <label style={{fontSize: '0.85rem', fontWeight: 700, display: 'block', marginBottom: '6px'}}>Chọn Số Ngày Thuê Sách:</label>
                                    <select className="form-control" value={rentDays} onChange={e => setRentDays(e.target.value)}>
                                        <option value="3">Thuê 3 ngày (Đọc nhanh)</option>
                                        <option value="7">Thuê 7 ngày (1 tuần - Khuyên dùng)</option>
                                        <option value="14">Thuê 14 ngày (2 tuần)</option>
                                    </select>
                                </div>

                                <button className="btn-rent" style={{width: '100%', padding: '14px', fontSize: '1rem', background: '#10b981'}} onClick={handleConfirmBookCheckout}>
                                    <i className="fas fa-check-circle"></i> Xác Nhận Đặt Thuê Qua Ví Nội Bộ
                                </button>
                            </div>
                        </div>
                    )}

                    {/* MODAL ĐĂNG NHẬP ĐỘC GIẢ */}
                    {showLoginModal && (
                        <div className="modal-overlay">
                            <div className="modal-card" style={{maxWidth: '420px'}}>
                                <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '16px'}}>
                                    <h3 style={{fontSize: '1.1rem', fontWeight: 800}}>Đăng Nhập Tài Khoản Độc Giả</h3>
                                    <button style={{background: 'none', border: 'none', fontSize: '1.4rem', cursor: 'pointer'}} onClick={() => setShowLoginModal(false)}>&times;</button>
                                </div>
                                <form onSubmit={handleReaderLogin}>
                                    <div style={{marginBottom: '12px'}}>
                                        <label style={{display: 'block', fontSize: '0.85rem', fontWeight: 700}}>Email hoặc SĐT (*)</label>
                                        <input type="text" style={{width: '100%', padding: '10px', borderRadius: '8px', border: '1px solid #cbd5e1'}} required value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} />
                                    </div>
                                    <div style={{marginBottom: '16px'}}>
                                        <label style={{display: 'block', fontSize: '0.85rem', fontWeight: 700}}>Mật Khẩu (*)</label>
                                        <input type="password" style={{width: '100%', padding: '10px', borderRadius: '8px', border: '1px solid #cbd5e1'}} required value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} />
                                    </div>
                                    <button type="submit" className="btn-auth" style={{width: '100%', padding: '12px'}}><i className="fas fa-sign-in-alt"></i> Đăng Nhập Ngay</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL ĐĂNG KÝ ĐỘC GIẢ */}
                    {showRegModal && (
                        <div className="modal-overlay">
                            <div className="modal-card" style={{maxWidth: '440px'}}>
                                <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '16px'}}>
                                    <h3 style={{fontSize: '1.1rem', fontWeight: 800}}>Đăng Ký Tài Khoản Độc Giả Mới</h3>
                                    <button style={{background: 'none', border: 'none', fontSize: '1.4rem', cursor: 'pointer'}} onClick={() => setShowRegModal(false)}>&times;</button>
                                </div>
                                <form onSubmit={handleReaderRegister}>
                                    <div style={{marginBottom: '10px'}}>
                                        <label style={{display: 'block', fontSize: '0.8rem', fontWeight: 700}}>Họ và Tên (*)</label>
                                        <input type="text" style={{width: '100%', padding: '8px', borderRadius: '8px', border: '1px solid #cbd5e1'}} required value={regForm.ho_ten} onChange={e => setRegForm({...regForm, ho_ten: e.target.value})} />
                                    </div>
                                    <div style={{marginBottom: '10px'}}>
                                        <label style={{display: 'block', fontSize: '0.8rem', fontWeight: 700}}>Email (*)</label>
                                        <input type="email" style={{width: '100%', padding: '8px', borderRadius: '8px', border: '1px solid #cbd5e1'}} required value={regForm.email} onChange={e => setRegForm({...regForm, email: e.target.value})} />
                                    </div>
                                    <div style={{marginBottom: '16px'}}>
                                        <label style={{display: 'block', fontSize: '0.8rem', fontWeight: 700}}>Mật Khẩu (*)</label>
                                        <input type="password" style={{width: '100%', padding: '8px', borderRadius: '8px', border: '1px solid #cbd5e1'}} required value={regForm.password} onChange={e => setRegForm({...regForm, password: e.target.value})} />
                                    </div>
                                    <button type="submit" className="btn-auth" style={{width: '100%', padding: '12px', background: '#8b5cf6'}}><i className="fas fa-user-check"></i> Đăng Ký & Nhận Bonus 500k Ví</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* FLOATING LIVE CHAT BUTTON & WINDOW */}
                    <div style={{position: 'fixed', bottom: '24px', right: '24px', zIndex: 2500}}>
                        {!showLiveChat ? (
                            <button 
                                onClick={() => {
                                    if (!currentReader) return alert('Vui lòng đăng nhập tài khoản Độc giả để sử dụng tính năng Chat hỗ trợ!');
                                    setShowLiveChat(true);
                                }}
                                style={{
                                    background: 'linear-gradient(135deg, #2563eb, #3b82f6)',
                                    color: '#ffffff',
                                    border: 'none',
                                    borderRadius: '30px',
                                    padding: '14px 22px',
                                    fontWeight: 700,
                                    fontSize: '0.92rem',
                                    boxShadow: '0 10px 25px rgba(37, 99, 235, 0.4)',
                                    cursor: 'pointer',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '10px',
                                    transition: 'transform 0.2s'
                                }}
                            >
                                <i className="fas fa-comments" style={{fontSize: '1.2rem'}}></i>
                                <span>💬 Chat Hỗ Trợ 24/7</span>
                            </button>
                        ) : (
                            <div style={{
                                width: '360px',
                                height: '500px',
                                background: '#ffffff',
                                borderRadius: '20px',
                                boxShadow: '0 20px 50px rgba(15, 23, 42, 0.25)',
                                border: '1px solid #e2e8f0',
                                display: 'flex',
                                flexDirection: 'column',
                                overflow: 'hidden'
                            }}>
                                {/* CHAT HEADER */}
                                <div style={{
                                    background: 'linear-gradient(135deg, #1e293b, #2563eb)',
                                    color: '#ffffff',
                                    padding: '16px 20px',
                                    display: 'flex',
                                    justify: 'space-between',
                                    alignItems: 'center'
                                }}>
                                    <div style={{display: 'flex', alignItems: 'center', gap: '10px'}}>
                                        <div style={{position: 'relative'}}>
                                            <div style={{width: '36px', height: '36px', borderRadius: '50%', background: '#ffffff', color: '#2563eb', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: '0.9rem'}}>
                                                TT
                                            </div>
                                            <span style={{position: 'absolute', bottom: 0, right: 0, width: '10px', height: '10px', background: '#10b981', borderRadius: '50%', border: '2px solid #fff'}}></span>
                                        </div>
                                        <div>
                                            <h4 style={{fontSize: '0.95rem', fontWeight: 700, margin: 0, color: '#fff'}}>Thủ Thư Thư Viện 24/7</h4>
                                            <span style={{fontSize: '0.72rem', color: '#93c5fd'}}>Trực tuyến • Phản hồi tức thì</span>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setShowLiveChat(false)}
                                        style={{background: 'none', border: 'none', color: '#fff', fontSize: '1.2rem', cursor: 'pointer', opacity: 0.8}}
                                    >
                                        &times;
                                    </button>
                                </div>

                                {/* CHAT MESSAGES BODY */}
                                <div style={{
                                    flex: 1,
                                    padding: '16px',
                                    overflowY: 'auto',
                                    background: '#f8fafc',
                                    display: 'flex',
                                    flexDirection: 'column',
                                    gap: '12px'
                                }}>
                                    {chatMessages.length === 0 ? (
                                        <div style={{textAlign: 'center', color: '#64748b', fontSize: '0.85rem', marginTop: '40px'}}>
                                            <i className="fas fa-comment-dots" style={{fontSize: '2rem', color: '#cbd5e1', marginBottom: '10px', display: 'block'}}></i>
                                            Chào bạn! Hãy gửi câu hỏi hoặc thắc mắc về sách, thẻ thư viện để Thủ thư hỗ trợ bạn nhé.
                                        </div>
                                    ) : (
                                        chatMessages.map(msg => {
                                            const isMe = msg.sender_type === 'reader';
                                            return (
                                                <div 
                                                    key={msg.id} 
                                                    style={{
                                                        alignSelf: isMe ? 'flex-end' : 'flex-start',
                                                        maxWidth: '82%'
                                                    }}
                                                >
                                                    <div style={{
                                                        background: isMe ? '#2563eb' : '#ffffff',
                                                        color: isMe ? '#ffffff' : '#1e293b',
                                                        padding: '10px 14px',
                                                        borderRadius: isMe ? '16px 16px 4px 16px' : '16px 16px 16px 4px',
                                                        fontSize: '0.86rem',
                                                        lineHeight: '1.4',
                                                        boxShadow: isMe ? '0 4px 12px rgba(37,99,235,0.2)' : '0 2px 6px rgba(0,0,0,0.06)',
                                                        border: isMe ? 'none' : '1px solid #e2e8f0'
                                                    }}>
                                                        {msg.message_text}
                                                    </div>
                                                    <div style={{
                                                        fontSize: '0.68rem',
                                                        color: '#94a3b8',
                                                        marginTop: '4px',
                                                        textAlign: isMe ? 'right' : 'left'
                                                    }}>
                                                        {isMe ? 'Bạn' : 'Thủ Thư'} • {msg.created_at ? msg.created_at.slice(11, 16) : ''}
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>

                                {/* CHAT INPUT FORM */}
                                <form 
                                    onSubmit={handleSendChatMessage}
                                    style={{
                                        padding: '12px 14px',
                                        background: '#ffffff',
                                        borderTop: '1px solid #e2e8f0',
                                        display: 'flex',
                                        gap: '8px'
                                    }}
                                >
                                    <input 
                                        type="text" 
                                        placeholder="Nhập tin nhắn..." 
                                        value={chatInput} 
                                        onChange={e => setChatInput(e.target.value)}
                                        style={{
                                            flex: 1,
                                            padding: '10px 14px',
                                            borderRadius: '20px',
                                            border: '1px solid #cbd5e1',
                                            fontSize: '0.86rem',
                                            outline: 'none'
                                        }}
                                    />
                                    <button 
                                        type="submit"
                                        style={{
                                            background: '#2563eb',
                                            color: '#ffffff',
                                            border: 'none',
                                            borderRadius: '50%',
                                            width: '38px',
                                            height: '38px',
                                            display: 'flex',
                                            alignItems: 'center',
                                            justifyContent: 'center',
                                            cursor: 'pointer'
                                        }}
                                    >
                                        <i className="fas fa-paper-plane" style={{fontSize: '0.85rem'}}></i>
                                    </button>
                                </form>
                            </div>
                        )}
                    </div>

                    {/* AI BOOK SUMMARIZER & CHATBOT MODAL */}
                    {showAiModal && (
                            <div className="modal-overlay" onClick={() => setShowAiModal(false)}>
                                <div className="modal-card" style={{maxWidth: '720px', border: '2px solid #3b82f6'}} onClick={e => e.stopPropagation()}>
                                    <div className="modal-header" style={{borderBottom: '2px solid #eff6ff'}}>
                                        <h3 style={{display: 'flex', alignItems: 'center', gap: '10px', color: '#1d4ed8'}}>
                                            <i className="fas fa-robot" style={{color: '#2563eb', fontSize: '1.4rem'}}></i>
                                            Trợ Lý AI Tóm Tắt & Hỏi Đáp Sách
                                        </h3>
                                        <button className="close-btn" onClick={() => setShowAiModal(false)}>×</button>
                                    </div>

                                    {aiLoading ? (
                                        <div style={{textAlign: 'center', padding: '40px 0'}}>
                                            <div style={{width: '40px', height: '40px', border: '4px solid #e0f2fe', borderTop: '4px solid #3b82f6', borderRadius: '50%', animation: 'spin 0.8s linear infinite', margin: '0 auto 16px'}}></div>
                                            <p style={{color: '#2563eb', fontWeight: 700}}>🤖 AI đang phân tích toàn bộ nội dung cuốn "{aiBookTitle}"...</p>
                                        </div>
                                    ) : aiSummary && (
                                        <div>
                                            <div style={{background: 'linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%)', borderRadius: '14px', padding: '16px 20px', marginBottom: '20px', border: '1px solid #bfdbfe'}}>
                                                <h4 style={{fontSize: '1.05rem', fontWeight: 800, color: '#1e40af', marginBottom: '6px'}}>📘 {aiSummary.title}</h4>
                                                <p style={{fontSize: '0.88rem', color: '#1e3a8a', lineHeight: 1.6, margin: 0}}>{aiSummary.overview}</p>
                                            </div>

                                            <div style={{marginBottom: '20px'}}>
                                                <h4 style={{fontSize: '0.9rem', fontWeight: 800, color: '#1e293b', marginBottom: '10px'}}><i className="fas fa-lightbulb" style={{color: '#f59e0b'}}></i> 3 Bài Học Cốt Lõi (Core Takeaways):</h4>
                                                <div style={{display: 'flex', flexDirection: 'column', gap: '8px'}}>
                                                    {aiSummary.key_takeaways.map((item, idx) => (
                                                        <div key={idx} style={{background: '#f8fafc', padding: '10px 14px', borderRadius: '10px', fontSize: '0.85rem', color: '#334155', borderLeft: '4px solid #3b82f6'}}>
                                                            {item}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div style={{marginBottom: '20px'}}>
                                                <h4 style={{fontSize: '0.9rem', fontWeight: 800, color: '#1e293b', marginBottom: '10px'}}><i className="fas fa-quote-left" style={{color: '#8b5cf6'}}></i> Trích Dẫn Đắt Giá:</h4>
                                                {aiSummary.quotes.map((q, idx) => (
                                                    <p key={idx} style={{fontSize: '0.85rem', color: '#4c1d95', fontStyle: 'italic', background: '#f5f3ff', padding: '8px 14px', borderRadius: '8px', borderLeft: '3px solid #8b5cf6', margin: '4px 0'}}>
                                                        {q}
                                                    </p>
                                                ))}
                                            </div>

                                            {/* AI INTERACTIVE CHAT WINDOW */}
                                            <div style={{border: '1px solid #e2e8f0', borderRadius: '16px', padding: '16px', background: '#ffffff'}}>
                                                <h4 style={{fontSize: '0.9rem', fontWeight: 800, color: '#1e293b', marginBottom: '12px', display: 'flex', alignItems: 'center', gap: '8px'}}>
                                                    <i className="fas fa-comments" style={{color: '#10b981'}}></i> Hỏi Đáp Trực Tiếp Với AI Về Cuốn Sách Này
                                                </h4>
                                                <div style={{maxHeight: '180px', overflowY: 'auto', marginBottom: '12px', display: 'flex', flexDirection: 'column', gap: '8px', padding: '8px', background: '#f8fafc', borderRadius: '12px'}}>
                                                    {aiChatLog.map((chat, idx) => (
                                                        <div key={idx} style={{alignSelf: chat.sender === 'user' ? 'flex-end' : 'flex-start', maxWidth: '85%', background: chat.sender === 'user' ? '#2563eb' : '#ffffff', color: chat.sender === 'user' ? '#ffffff' : '#1e293b', padding: '8px 14px', borderRadius: '14px', fontSize: '0.83rem', boxShadow: '0 2px 6px rgba(0,0,0,0.05)', border: chat.sender === 'user' ? 'none' : '1px solid #cbd5e1'}}>
                                                            {chat.text}
                                                        </div>
                                                    ))}
                                                </div>

                                                <form onSubmit={handleSendAiChat} style={{display: 'flex', gap: '8px'}}>
                                                    <input 
                                                        type="text" 
                                                        className="form-control" 
                                                        placeholder="Đặt câu hỏi cho AI (VD: Áp dụng cuốn sách này như thế nào?)..." 
                                                        value={aiChatInput}
                                                        onChange={e => setAiChatInput(e.target.value)}
                                                        style={{flex: 1, borderRadius: '20px'}}
                                                    />
                                                    <button className="btn-rent" style={{borderRadius: '20px', padding: '8px 18px', background: '#2563eb'}} type="submit">
                                                        <i className="fas fa-paper-plane"></i> Gửi
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
            );
        }

        try {
            if (typeof ReactDOM.createRoot === 'function') {
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(<ReaderApp />);
            } else {
                ReactDOM.render(<ReaderApp />, document.getElementById('root'));
            }
        } catch (e) {
            console.error('Mount error:', e);
            document.getElementById('root').innerHTML = '<div style="padding: 30px; text-align: center; color: #ef4444; font-family: sans-serif;"><h3>⚠️ Lỗi Khởi Chạy:</h3><p>' + e.message + '</p></div>';
        }
    </script>
</body>
</html>
